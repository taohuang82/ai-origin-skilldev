impact_edges:
  - source: "architecture"
    targets:
      - element: "data-model"
        impact_type: "direct"
        reason: "逻辑架构直接影响存储与分库分表策略"
      - element: "integration"
        impact_type: "direct"
        reason: "部署与调用链决定集成拓扑"
      - element: "backend-impl"
        impact_type: "indirect"
        reason: "技术栈变更可能影响分层约定"
      - element: "config"
        impact_type: "indirect"
        reason: "中间件选型决定公共组件实现"

  - source: "data-model"
    targets:
      - element: "api-contract"
        impact_type: "direct"
        reason: "资源与实体决定 API 模型"
      - element: "backend-impl"
        impact_type: "direct"
        reason: "持久化与状态机约束业务实现"
      - element: "config"
        impact_type: "indirect"
        reason: "字段约束/枚举影响数据字典"

  - source: "api-contract"
    targets:
      - element: "backend-impl"
        impact_type: "direct"
        reason: "契约是服务实现的约束"
      - element: "frontend"
        impact_type: "direct"
        reason: "前端依赖 API 与错误码约定"
      - element: "config"
        impact_type: "indirect"
        reason: "鉴权/幂等等可能影响配置项"

  - source: "backend-impl"
    targets:
      - element: "integration"
        impact_type: "direct"
        reason: "业务编排驱动异步与外部调用"
      - element: "api-contract"
        impact_type: "indirect"
        reason: "实现细节可能反向推导接口调整"

  - source: "integration"
    targets:
      - element: "backend-impl"
        impact_type: "indirect"
        reason: "MQ/外部服务变化可能影响业务时序"
      - element: "config"
        impact_type: "indirect"
        reason: "集成配置项变化"

  - source: "config"
    targets:
      - element: "frontend"
        impact_type: "indirect"
        reason: "字典、权限与开关影响前端行为"
      - element: "api-contract"
        impact_type: "indirect"
        reason: "权限变更可能需要在 API 上增加鉴权注解"

  - source: "frontend"
    targets:
      - element: "config"
        impact_type: "indirect"
        reason: "页面菜单资源变更需同步权限矩阵"
