# atomic-change-registry.yaml
# 读取者：@ia-overall-designer (STAGE=change-router, workflow=design-incremental-build)
# 编排不再直接读取此文件；主 Agent Phase 0 仅校验路径存在性。
# 来源：TDD 增量高阶方案 V1.0 第五章
#
# PRD 要素域分类（10 类）：
# IA - 信息架构 (Info Architecture)
# FS - 功能特性 (Feature Spec)
# UP - 界面原型 (UI Prototype)
# PD - 权限设计 (Permission Design)
# ID - 集成设计 (Integration Design)
# SS - 场景方案 (Scenario Solution)
# NF - 非功能需求 (Non-Functional)
# AA - 应用架构 (App Architecture)
# CF - 配置设计 (Config Design)
# PP - 定位与目标 (Product Positioning)
#
# ─── PRD 子要素覆盖说明（来源：TDD 高阶 §5.11）─────────────
# 本清单仅列出能独立触发设计变更的子要素作为原子变化点。
# 以下 PRD 子要素的变更通常是上游变化点的连带结果（cascade），
# 不作为独立变化点，而是在要素循环中作为上下文参考：
#
#   功能特性.实体操作说明       → cascade←IA-01/IA-02 或 FS-01
#   功能特性.验收标准           → cascade←FS-02/FS-03
#   信息架构.数据样例           → cascade←IA-02（Step 6 中作为验证参考）
#   信息架构.历史数据切换       → cascade←IA 类（AP 类型场景专属）
#   场景解决方案.解决方案集成图 → cascade←SS-01（随场景清单连带重绘）
#   Story设计                   → 输入层，通过 PrdChange 登记引用，非独立变化点
#
# 完整的 PRD 子要素 → 原子变化点对照关系见 TDD 高阶方案 §5.11 表格。

atomic_changes:

  # ─── IA 类（信息架构变更，5 个）────────────────
  - id: "IA-01"
    name: "新增/删除实体"
    category: "IA"
    source_domain: "prd"
    prd_element: "info-architecture"
    description_zh: "PRD 信息架构新增或删除业务对象"
    detection_keywords:
      - "DELTA"
      - "info-architecture"
      - "op=add"
      - "op=delete"
      - "实体清单变化"
      - "新增实体"
      - "删除实体"
    examples:
      - "增量 PRD 新增 Supplier 实体"
    status: "active"

  - id: "IA-02"
    name: "实体属性变更"
    category: "IA"
    source_domain: "prd"
    prd_element: "info-architecture"
    description_zh: "PRD 信息架构中已有实体的属性增加、修改或删除"
    detection_keywords:
      - "info-architecture"
      - "实体详情表字段"
      - "字段增减"
      - "属性新增"
      - "属性修改"
    examples:
      - "PurchaseOrder 实体新增 supplier_code 字段"
    status: "active"

  - id: "IA-03"
    name: "实体关系变更"
    category: "IA"
    source_domain: "prd"
    prd_element: "info-architecture"
    description_zh: "PRD 信息架构中实体间关联关系调整"
    detection_keywords:
      - "info-architecture"
      - "ER 图变化"
      - "外键标注变化"
      - "关联关系调整"
    examples:
      - "User 与 Role 从一对多改为多对多"
    status: "active"

  - id: "IA-04"
    name: "实体状态流转变更"
    category: "IA"
    source_domain: "prd"
    prd_element: "info-architecture"
    description_zh: "PRD 信息架构中实体状态机调整"
    detection_keywords:
      - "info-architecture"
      - "状态流转图变化"
      - "新增状态"
      - "状态机调整"
    examples:
      - "Order 新增'待发货'状态节点"
    status: "active"

  - id: "IA-05"
    name: "属性约束/枚举值变更"
    category: "IA"
    source_domain: "prd"
    prd_element: "info-architecture"
    description_zh: "PRD 信息架构中实体属性的约束条件或枚举值域调整"
    detection_keywords:
      - "info-architecture"
      - "属性约束"
      - "枚举值"
      - "值域调整"
    examples:
      - "优先级字段从 2 个枚举值扩展为 4 个"
    status: "active"

  # ─── FS 类（功能特性变更，6 个）────────────────
  - id: "FS-01"
    name: "子特性新增/删除"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性新增或删除子特性"
    detection_keywords:
      - "feature-spec"
      - "op=add"
      - "op=delete"
      - "FR 编号变化"
      - "新增子特性"
    examples:
      - "新增 FR-01-03-002 供应商指定子特性"
    status: "active"

  - id: "FS-02"
    name: "业务规则变更"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性中业务规则新增或修改"
    detection_keywords:
      - "feature-spec"
      - "业务规则"
      - "规则变化"
      - "阈值"
    examples:
      - "审批金额阈值从 5 万改为 10 万"
    status: "active"

  - id: "FS-03"
    name: "UIUX 操作说明变更"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性中操作步骤、触发动作调整"
    detection_keywords:
      - "feature-spec"
      - "UIUX 操作说明"
      - "操作步骤"
      - "触发动作"
    examples:
      - "提交操作增加二次确认弹窗"
    status: "active"

  - id: "FS-04"
    name: "导入导出/报表功能变更"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性中导入、导出或报表类子特性新增或修改"
    detection_keywords:
      - "feature-spec"
      - "导入"
      - "批量导入"
      - "导出"
      - "报表"
      - "批量导出"
    examples:
      - "新增采购单批量导入功能"
      - "新增采购单批量导出功能"
    status: "active"

  - id: "FS-05"
    name: "系统自动触发功能变更"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性中定时/自动执行的子特性新增或修改"
    detection_keywords:
      - "feature-spec"
      - "自动"
      - "定时"
      - "超时"
      - "触发"
    examples:
      - "审批超时 24 小时自动转交"
    status: "active"

  - id: "FS-06"
    name: "知会/通知功能变更"
    category: "FS"
    source_domain: "prd"
    prd_element: "feature-spec"
    description_zh: "PRD 功能特性中消息通知类子特性新增或修改"
    detection_keywords:
      - "feature-spec"
      - "通知"
      - "知会"
      - "提醒"
      - "邮件"
    examples:
      - "审批通过后邮件通知申请人"
    status: "active"

  # ─── UP 类（界面原型变更，5 个）────────────────
  - id: "UP-01"
    name: "页面新增/删除"
    category: "UP"
    source_domain: "prd"
    prd_element: "ui-prototype"
    description_zh: "PRD 界面原型中页面清单增加或删除"
    detection_keywords:
      - "ui-prototype"
      - "页面清单"
      - "PAGE 编号变化"
      - "新增页面"
    examples:
      - "新增供应商指定弹窗页面 PAGE-005"
    status: "active"

  - id: "UP-02"
    name: "页面字段/布局调整"
    category: "UP"
    source_domain: "prd"
    prd_element: "ui-prototype"
    description_zh: "PRD 界面原型中已有页面的字段、列、布局变更"
    detection_keywords:
      - "ui-prototype"
      - "页面规格"
      - "字段增减"
      - "布局调整"
    examples:
      - "列表页新增'创建人部门'列"
    status: "active"

  - id: "UP-03"
    name: "交互原型/Pageflow 变更"
    category: "UP"
    source_domain: "prd"
    prd_element: "ui-prototype"
    description_zh: "PRD 界面原型中页面间跳转关系或交互逻辑调整"
    detection_keywords:
      - "ui-prototype"
      - "Pageflow"
      - "页面跳转"
      - "交互原型"
    examples:
      - "提交后跳转路径由列表改为详情页"
    status: "active"

  - id: "UP-04"
    name: "菜单变更"
    category: "UP"
    source_domain: "prd"
    prd_element: "ui-prototype"
    description_zh: "PRD 界面原型中菜单结构调整"
    detection_keywords:
      - "ui-prototype"
      - "菜单项增减"
      - "菜单变更"
    examples:
      - "二级菜单新增'供应商管理'"
    status: "active"

  - id: "UP-05"
    name: "兼容性设计变更"
    category: "UP"
    source_domain: "prd"
    prd_element: "ui-prototype"
    description_zh: "PRD 界面原型中浏览器支持、分辨率、响应式设计要求调整"
    detection_keywords:
      - "ui-prototype"
      - "兼容性设计"
      - "响应式"
      - "移动端"
    examples:
      - "新增移动端适配要求"
    status: "active"

  # ─── PD 类（权限设计变更，3 个）────────────────
  - id: "PD-01"
    name: "角色定义变更"
    category: "PD"
    source_domain: "prd"
    prd_element: "permission-design"
    description_zh: "PRD 权限设计中角色新增、删除或职责调整"
    detection_keywords:
      - "permission-design"
      - "角色清单变化"
      - "新增角色"
    examples:
      - "新增'供应商管理员'角色"
    status: "active"

  - id: "PD-02"
    name: "功能权限变更"
    category: "PD"
    source_domain: "prd"
    prd_element: "permission-design"
    description_zh: "PRD 权限设计中按钮/菜单权限矩阵调整"
    detection_keywords:
      - "permission-design"
      - "功能权限矩阵"
      - "权限行列变化"
    examples:
      - "'指定供应商'按钮仅采购员可见"
    status: "active"

  - id: "PD-03"
    name: "数据权限/敏感数据变更"
    category: "PD"
    source_domain: "prd"
    prd_element: "permission-design"
    description_zh: "PRD 权限设计中数据可见范围或敏感字段标注调整"
    detection_keywords:
      - "permission-design"
      - "数据权限"
      - "敏感数据"
      - "数据可见范围"
    examples:
      - "部门主管可查看全部门数据"
    status: "active"

  # ─── ID 类（集成设计变更，3 个）────────────────
  - id: "ID-01"
    name: "外部系统新增/删除"
    category: "ID"
    source_domain: "prd"
    prd_element: "integration-design"
    description_zh: "PRD 集成设计中外部系统依赖新增或删除"
    detection_keywords:
      - "integration-design"
      - "外部系统清单变化"
      - "新增对接"
    examples:
      - "新增与 SAP 系统的对接"
    status: "active"

  - id: "ID-02"
    name: "集成点新增/修改"
    category: "ID"
    source_domain: "prd"
    prd_element: "integration-design"
    description_zh: "PRD 集成设计中集成点的同步/异步方式调整"
    detection_keywords:
      - "integration-design"
      - "集成点变化"
      - "同步改异步"
    examples:
      - "订单同步从实时 API 改为 MQ 异步"
    status: "active"

  - id: "ID-03"
    name: "集成接口规范变更"
    category: "ID"
    source_domain: "prd"
    prd_element: "integration-design"
    description_zh: "PRD 集成设计中接口入参、出参、协议调整"
    detection_keywords:
      - "integration-design"
      - "接口规范变化"
      - "入参出参"
    examples:
      - "订单接口新增'渠道来源'入参"
    status: "active"

  # ─── SS 类（场景方案变更，3 个）────────────────
  - id: "SS-01"
    name: "场景新增/删除/流转变更"
    category: "SS"
    source_domain: "prd"
    prd_element: "scenario-solution"
    description_zh: "PRD 场景解决方案中场景清单变化或场景串联路径调整"
    detection_keywords:
      - "scenario-solution"
      - "场景清单"
      - "解决方案集成图"
      - "场景串联"
    examples:
      - "新增'供应商指定'场景串联"
    status: "active"

  - id: "SS-02"
    name: "异常场景/处理策略变更"
    category: "SS"
    source_domain: "prd"
    prd_element: "scenario-solution"
    description_zh: "PRD 场景解决方案中异常分支或异常处理策略调整"
    detection_keywords:
      - "scenario-solution"
      - "异常场景"
      - "异常处理"
      - "降级"
    examples:
      - "外部服务失败从阻断改为降级"
    status: "active"

  - id: "SS-03"
    name: "审批场景变更"
    category: "SS"
    source_domain: "prd"
    prd_element: "scenario-solution"
    description_zh: "PRD 场景解决方案中审批类场景流程或角色调整"
    detection_keywords:
      - "scenario-solution"
      - "审批场景"
      - "审批流"
    examples:
      - "审批流增加'部门预审'节点"
    status: "active"

  # ─── NF 类（非功能需求变更，5 个）───────────────
  - id: "NF-01"
    name: "性能要求变更"
    category: "NF"
    source_domain: "prd"
    prd_element: "nfr"
    description_zh: "PRD 非功能需求中响应时间、并发、吞吐等指标调整"
    detection_keywords: ["nfr", "性能", "响应时间", "并发"]
    examples: ["响应时间从 3 秒收紧到 1 秒"]
    status: "active"

  - id: "NF-02"
    name: "安全隐私要求变更"
    category: "NF"
    source_domain: "prd"
    prd_element: "nfr"
    description_zh: "PRD 非功能需求中加密、脱敏、隐私保护、合规要求调整"
    detection_keywords: ["nfr", "安全隐私", "加密", "脱敏", "GDPR"]
    examples: ["新增 GDPR 合规要求、手机号脱敏"]
    status: "active"

  - id: "NF-03"
    name: "可用性/可维护性变更"
    category: "NF"
    source_domain: "prd"
    prd_element: "nfr"
    description_zh: "PRD 非功能需求中 SLA / RTO / RPO / 日志规范 / 监控指标调整"
    detection_keywords: ["nfr", "可用性", "SLA", "RTO", "RPO"]
    examples: ["可用性从 99.9% 提升到 99.99%"]
    status: "active"

  - id: "NF-04"
    name: "易用性要求变更"
    category: "NF"
    source_domain: "prd"
    prd_element: "nfr"
    description_zh: "PRD 非功能需求中操作步骤、错误提示、界面交互易用性指标调整"
    detection_keywords: ["nfr", "易用性", "操作步骤"]
    examples: ["关键操作流程步骤不超过 5 步"]
    status: "active"

  - id: "NF-05"
    name: "埋点要求变更"
    category: "NF"
    source_domain: "prd"
    prd_element: "nfr"
    description_zh: "PRD 非功能需求中新增或调整页面/操作埋点"
    detection_keywords: ["nfr", "埋点", "埋点设计"]
    examples: ["新增订单提交按钮点击埋点"]
    status: "active"

  # ─── AA 类（应用架构变更，2 个）────────────────
  - id: "AA-01"
    name: "应用架构图/系统边界变更"
    category: "AA"
    source_domain: "prd"
    prd_element: "app-architecture"
    description_zh: "PRD 应用架构图中模块划分或外部系统依赖关系调整"
    detection_keywords: ["app-architecture", "架构图", "系统边界"]
    examples: ["架构图新增 SAP 系统依赖节点"]
    status: "active"

  - id: "AA-02"
    name: "特性分类/特性层级变更"
    category: "AA"
    source_domain: "prd"
    prd_element: "app-architecture"
    description_zh: "PRD 应用架构中特性分类、特性、子特性的层级结构或编号体系调整"
    detection_keywords: ["app-architecture", "子特性清单", "特性分类"]
    examples: ["新增'供应商管理'特性分类，下辖 2 个子特性"]
    status: "active"

  # ─── CF 类（配置设计变更，2 个）────────────────
  - id: "CF-01"
    name: "用户配置项变更"
    category: "CF"
    source_domain: "prd"
    prd_element: "config-design"
    description_zh: "PRD 配置设计中业务可配置项新增或修改"
    detection_keywords: ["config-design", "用户配置项"]
    examples: ["审批金额阈值改为用户可配置"]
    status: "active"

  - id: "CF-02"
    name: "IT 管理配置项变更"
    category: "CF"
    source_domain: "prd"
    prd_element: "config-design"
    description_zh: "PRD 配置设计中 IT 运维配置项新增或修改"
    detection_keywords: ["config-design", "IT管理配置项"]
    examples: ["新增系统超时时间配置项"]
    status: "active"

  # ─── PP 类（定位与目标变更，1 个）───────────────
  - id: "PP-01"
    name: "产品目标/范围变更"
    category: "PP"
    source_domain: "prd"
    prd_element: "product-positioning"
    description_zh: "PRD 定位与目标中产品范围边界、成功标准或灰度策略调整"
    detection_keywords: ["product-positioning", "范围和边界", "产品目标"]
    examples: ["产品范围新增'供应商管理'子领域"]
    status: "active"
