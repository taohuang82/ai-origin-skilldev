# 代码信号注册表 — 轻量模式与 ia-dependency-analyzer 子代理共享
# 定义每个要素在代码库中的识别信号与推断规则
# 挂载于 config.yaml → extension_registry.code_signals
# 消费协议见 docs/轻量模式实现方案.md §2.0 与 subagents/ia-dependency-analyzer.md Phase 0.5
#
# 消费方（运行时互斥，详见 ia-prd-to-design/docs/ia-dependency-analyzer-code-signal-refactor-plan.md §1.4）：
#   1. 轻量模式主会话（见 docs/轻量模式实现方案.md §2.0）
#      - 消费字段：files / grep / extract / infer / spec_load_trigger
#      - 忽略字段：exploration_focus / output_target（见 ia-dependency-analyzer-code-signal-refactor-plan.md §5.2，子代理专属）
#      - 调用时机：design-lightweight-incremental，Phase 2 档位判定 + Phase 3 设计推断
#   2. ia-dependency-analyzer 子代理（见 subagents/ia-dependency-analyzer.md Phase 0.5）
#      - 消费字段：files / grep / extract / infer / spec_load_trigger / exploration_focus / output_target
#      - 调用时机：design-incremental-build，Phase A 之前产出 shared-context.md
#
# docs/init 文件路径约定：
#   使用 **/docs/init/*.md 通配，自动适配以下目录结构：
#   - 单体项目：docs/init/
#   - 多模块项目（backend/frontend）：backend/docs/init/、frontend/docs/init/
#   - 多 starter 项目：*-starter/docs/init/
#
# specs/tech-arch 文件路径约定（it-project-initializer 产物）：
#   使用 **/specs/tech-arch/**/*.md 和 **/specs/tech-arch/**/*.json 通配，自动适配：
#   - 根目录：specs/tech-arch/
#   - 子项目：specs/tech-arch/{starter-name}/
#   核心文件说明：
#   - project-profile.json：项目拓扑、类型、数据库配置、子项目清单
#   - REPO_INDEX.md：代码仓快速导航（GroupId、框架、目录结构）
#   - REPO_RELATIONSHIPS.md：代码仓关系（Mermaid架构图、调用链、跨仓依赖）
#   - MULTI_PROJECT_INDEX.md：多项目索引（子项目总览、共享模块、端口、启动类）
#   - ARCHITECTURE.md：架构文档（DDD分层、技术栈、包结构规范、代码规范）
#   - MODULE_INDEX.md：业务模块索引（模块清单、分层类数量、模块依赖）
#   - API_LIST.md：API端点清单（Controller列表、请求参数、响应类型、权限控制）
#   - CLASS_LIST.md：类清单（VO/DTO/PO/Query/Command/APPService/DomainService/Repository/DAO/Converter）
#   - DATABASE.md：数据库架构（数据源配置、表清单、字段列表、跨数据源访问）
#   - DEPLOYMENT.md：部署文档（环境要求、JVM参数、健康检查端点）
#   - EXTERNAL_SERVICES.md：外部服务总览（RpcClient/SdkClient端点、防腐层映射、SDK依赖清单）
#
# docs/sys_kl 文件路径约定：
#   使用 **/docs/sys_kl/**/*.yaml 和 **/docs/sys_kl/**/*.md 通配，自动适配：
#   - 根目录：docs/sys_kl/{project}/
#   - 子模块：backend/docs/sys_kl/{project}/
#   sys_kl 核心文件说明：
#   - knowledge_graph.yaml：结构化知识图谱（节点/边/不变式/策略/聚合根）
#   - semantic_core_package.md：语义核心包（AI消费指南、业务规则汇总）
#   - ubiquitous_language.md：统一语言词典（术语定义、代码位置映射）
#   - 01_system_overview.md：系统概览（四层架构、核心流程、外部依赖）
#   - 02_strategic_map.md：战略地图（限界上下文划分、域间关系）
#   - contexts/*/01_developer_guide.md：各上下文开发指南（入口、主流程、代码锚点）
#   - contexts/*/02_business_guide.md：各上下文业务指南（聚合根、不变式、策略规则）
#   - contexts/*/03_business_flow.md：各上下文业务流程（时序图、状态流转）

code_signals:

  # ===== Architecture =====
  - element_id: arch-tech-stack
    scan:
      - files: ["pom.xml"]
        extract: ["spring-boot.version", "java.version", "dependency.groupId"]
      - files: ["package.json"]
        extract: ["dependencies", "devDependencies", "vue", "node"]
      - files: ["application.yml", "application-*.yml", "application.properties", "bootstrap.yml", "bootstrap.properties"]
        extract: ["spring.cloud", "spring.profiles", "server.port"]
      - files: ["**/specs/tech-arch/**/ARCHITECTURE.md"]
        extract: ["技术栈声明、框架版本、分层架构描述"]
      - files: ["**/docs/init/ARCHITECTURE.md"]
        extract: ["技术栈声明、框架版本、分层架构描述"]
    infer: "从依赖声明和框架配置推断技术栈"

  - element_id: arch-deployment
    scan:
      - files: ["Dockerfile*"]
        extract: ["基础镜像", "暴露端口", "构建阶段"]
      - files: ["**/specs/tech-arch/**/DEPLOYMENT.md"]
        extract: ["部署架构、环境要求、构建步骤、JVM参数、健康检查端点"]
      - files: ["**/docs/init/DEPLOYMENT.md"]
        extract: ["部署架构、环境要求、构建步骤、JVM参数、健康检查端点"]
    infer: "从 Dockerfile 和部署文档推断部署拓扑"
    spec_load_trigger: "项目无容器编排文件或用户要求非容器部署"

  - element_id: arch-microservice
    scan:
      - files: ["pom.xml"]
        extract: ["modules", "module"]
      - files: ["*-service/", "*-starter/", "*-app/"]
      - files: ["**/specs/tech-arch/project-profile.json"]
        extract: ["项目拓扑(topology)、子项目清单、启动模块、数据库配置"]
      - files: ["**/specs/tech-arch/REPO_RELATIONSHIPS.md"]
        extract: ["代码仓关系、调用关系、跨仓依赖、Mermaid调用关系图"]
      - files: ["**/specs/tech-arch/MULTI_PROJECT_INDEX.md"]
        extract: ["子项目总览、共享模块、端口、启动类、上下文路径"]
      - files: ["**/docs/init/REPO_RELATIONSHIPS.md"]
        extract: ["代码仓关系、调用关系、跨仓依赖、Mermaid调用关系图"]
      - files: ["**/docs/sys_kl/**/02_strategic_map.md"]
        extract: ["限界上下文划分、域间关系、上下文映射、核心域/支撑域/通用域"]
    infer: "从 Maven 模块结构和命名推断微服务划分"
    spec_load_trigger: "项目为单体应用需拆微服务，或模块结构与 PRD 差异大"

  - element_id: arch-code-structure
    scan:
      - files: ["*-interface/src/main/java/**/interfaces/", "*-interface/src/main/java/**/facade/"]
        pattern: "接口层：facade + dto + converter"
      - files: ["*-application/src/main/java/**/application/"]
        pattern: "应用层：AppService + Provider(导入导出)"
      - files: ["*-domain/src/main/java/**/domain/"]
        pattern: "领域层：service + repository(接口) + entity + command + delegate + enums + vo + query"
      - files: ["*-infrastructure/src/main/java/**/infrastructure/"]
        pattern: "基础设施层：repository(实现) + mapper(DAO) + po + converter + delegate(RPC实现)"
      - files: ["**/specs/tech-arch/**/ARCHITECTURE.md"]
        extract: ["分层架构描述、包结构规范、模块划分、代码规范"]
      - files: ["**/specs/tech-arch/**/MODULE_INDEX.md"]
        extract: ["业务模块索引、分层类清单、模块依赖关系"]
      - files: ["**/specs/tech-arch/MULTI_PROJECT_INDEX.md", "**/specs/tech-arch/REPO_INDEX.md"]
        extract: ["子项目列表、模块结构、核心模块说明"]
      - files: ["**/docs/init/ARCHITECTURE.md"]
        extract: ["分层架构描述、包结构规范、模块划分、代码规范"]
      - files: ["**/docs/init/MULTI_PROJECT_INDEX.md", "**/docs/init/REPO_INDEX.md"]
        extract: ["子项目列表、模块结构、核心模块说明"]
      - files: ["**/docs/init/MODULE_INDEX.md"]
        extract: ["业务模块索引、分层类清单、模块依赖关系"]
      - files: ["**/docs/sys_kl/**/01_system_overview.md"]
        extract: ["四层架构对应关系、核心流程、外部依赖、模块职责"]
      - files: ["**/docs/sys_kl/**/ubiquitous_language.md"]
        extract: ["术语定义、代码位置映射、领域词汇与代码命名对应"]
    infer: "从现有目录结构推断代码分层模式（DDD四层或传统三层）"
    spec_load_trigger: "PRD 要求新的工程结构层级"

  - element_id: arch-common-lib
    scan:
      - files: ["**/domain/share/", "**/share/"]
        extract: ["跨领域共享的 delegate/service/converter/enums/constant/vo"]
    infer: "从 share 模块推断公共库范围"
    spec_load_trigger: "无现有公共模块且 PRD 明确要求新建"

  - element_id: arch-feature-toggle
    scan:
      - files: ["application.yml", "*.properties"]
        grep: ["feature.toggle", "ff4j", "togglz", "unleash", "grey", "gray"]
    infer: "从配置中识别已有特性开关框架"
    spec_load_trigger: "PRD 要求新增特性开关能力且项目当前无"

  # ===== Data Model =====
  - element_id: data-table
    scan:
      - files: ["**/mapper/**/*DAO.xml"]
        extract: ["表名(tableName/resultMap)、字段映射(column)、SQL片段、索引暗示"]
      - files: ["**/specs/tech-arch/**/DATABASE.md"]
        extract: ["数据源配置、表清单、字段列表、索引、跨数据源访问、表与业务模块映射"]
      - files: ["**/docs/init/DB_SCHEMA.md"]
        extract: ["表结构、字段列表、索引建议、表关系图、数据来源统计"]
      - files: ["**/docs/sys_kl/**/knowledge_graph.yaml"]
        extract: ["实体节点、聚合根、字段定义、不变式约束"]
      - files: ["**/docs/sys_kl/**/contexts/*/02_business_guide.md"]
        extract: ["聚合根定义、实体属性、不变式规则、策略约束"]
      - files: ["**/po/**/*.java"]
        extract: ["@Table", "@Entity", "@Column", "PO 类命名与表名对应"]
    infer: "从 DAO XML 的 tableName/resultMap 推断表结构与字段映射，DATABASE.md/DB_SCHEMA.md 补充索引与关系，PO 作兜底参照"
    spec_load_trigger: "无 DAO XML 和文档可参照时，按 spec 标准产出"

  - element_id: data-cache
    scan:
      - files: ["pom.xml", "application.yml", "application.properties"]
        grep: ["redis", "caffeine", "caching", "cache", "@Cacheable", "ehcache"]
    infer: "从依赖和注解识别缓存框架与策略"
    spec_load_trigger: "项目未使用缓存且 PRD 明确要求引入"

  - element_id: data-state-machine
    scan:
      - files: ["**/enums/**"]
        grep: ["status", "state", "enum"]
      - files: ["**/docs/sys_kl/**/contexts/*/03_business_flow.md"]
        extract: ["状态流转、状态机定义、触发条件、流转规则"]
      - files: ["**/docs/sys_kl/**/knowledge_graph.yaml"]
        extract: ["不变式中的状态约束、策略中的状态转换规则"]
    infer: "从枚举类推断状态模型"
    spec_load_trigger: "项目无状态机模式且 PRD 明确要求状态流转"

  # ===== API Contract =====
  - element_id: be-api
    scan:
      - files: ["**/specs/tech-arch/**/API_LIST.md"]
        extract: ["API端点列表、请求参数、响应类型、权限控制、状态码约定、Controller统计"]
      - files: ["**/docs/init/API_REFERENCE.md"]
        extract: ["API端点列表、请求参数、响应类型、权限控制、状态码约定"]
      - files: ["**/facade/**/*.java", "**/controller/**/*.java"]
        extract: ["@RestController", "@RequestMapping", "@JalorOperation", "UIAPI/PrvAPI/PubAPI"]
      - files: ["**/dto/**/*.java", "**/vo/**/*.java", "**/converter/**/*.java"]
      - files: ["**/docs/sys_kl/**/contexts/*/01_developer_guide.md"]
        extract: ["Facade入口、主流程、API锚点、代码入口位置"]
    infer: "优先从 specs/docs 文档提取 API 契约，再从 Facade 代码补充命名、路径、参数模式"
    spec_load_trigger: "无 API 文档和 Facade 可参照（全新服务）"

  # ===== Backend Implementation =====
  - element_id: be-class
    scan:
      - files: ["**/service/**/*.java", "**/repository/**/*.java"]
      - files: ["**/entity/**/*.java", "**/dto/**/*.java", "**/po/**/*.java"]
      - files: ["**/command/**/*.java", "**/vo/**/*.java"]
      - files: ["**/specs/tech-arch/**/CLASS_LIST.md"]
        extract: ["类清单列表：VO/DTO/PO/Query/Command/APPService/DomainService/Validator/RepositoryImpl/DAO/Converter"]
      - files: ["**/docs/init/CLASSES.md"]
        extract: ["类清单列表：VO/DTO/PO/Query/Command/APPService/DomainService/Validator/RepositoryImpl/DAO/Converter"]
      - files: ["**/docs/sys_kl/**/knowledge_graph.yaml"]
        extract: ["聚合根、实体、值对象、领域服务的节点定义与关系"]
      - files: ["**/docs/sys_kl/**/ubiquitous_language.md"]
        extract: ["术语到代码类的映射、领域词汇与Java类名对应关系"]
    infer: "从现有分层推断 Service / Repository / Entity / DTO / PO / Command / VO 模式"
    spec_load_trigger: "无现有代码分层可参照"

  - element_id: be-sequence
    scan:
      - files: ["**/delegate/**/*.java"]
      - files: ["**/application/**/*APPService.java", "**/application/**/*AppService.java"]
      - files: ["**/docs/sys_kl/**/contexts/*/01_developer_guide.md"]
        extract: ["主流程、调用链、Facade→AppService→DomainService路径"]
      - files: ["**/docs/sys_kl/**/contexts/*/03_business_flow.md"]
        extract: ["时序图、调用顺序、跨域交互流程"]
    infer: "从 Delegate/APPService 推断调用链模式"
    spec_load_trigger: "PRD 场景需跨服务调用，现有代码无先例"

  - element_id: be-transaction
    scan:
      - files: ["**/service/**/*.java", "**/repository/**/*.java"]
        grep: ["@Transactional", "TransactionTemplate", "rollbackFor", "txManager"]
      - files: ["**/application/**/*AppService.java"]
        grep: ["@Transactional"]
      - files: ["**/docs/sys_kl/**/semantic_core_package.md"]
        extract: ["事务边界规则、一致性约束、跨聚合事务策略"]
    infer: "从 @Transactional 注解识别事务边界与多数据源事务管理模式"
    spec_load_trigger: "PRD 要求分布式事务或复杂事务边界"

  - element_id: be-export
    scan:
      - files: ["**/*ExcelProvider*", "**/*ExportExcelProvider*", "**/*ExportConsumer*", "**/*Consumer*"]
        grep: ["IExcelDataProvider", "IDownloadSupport", "IExcelExportContext", "poi", "easyexcel"]
      - files: ["**/config/*.excelExport.xml"]
        extract: ["Excel 导出 XML 配置"]
      - files: ["pom.xml"]
        grep: ["excel", "poi", "easyexcel", "export"]
    infer: "从已有导出代码和配置推断 Excel 导出框架与风格"
    spec_load_trigger: "项目无导出功能且 PRD 明确要求"

  - element_id: be-import
    scan:
      - files: ["**/*ImportExcelProvider*", "**/*ImportConsumer*", "**/*ImportTask*", "**/*ImportResult*"]
        grep: ["IExcelDataProvider", "IExcelImportContext", "IDownloadSupport", "ImportTask", "ImportResult"]
      - files: ["**/config/*.excelImport.xml"]
        extract: ["Excel 导入 XML 配置", "excelId", "provider", "consumer"]
      - files: ["**/config/*.async.message.beans.xml", "**/config/async*"]
        extract: ["异步导入任务 Bean 配置"]
      - files: ["pom.xml"]
        grep: ["excel", "poi", "easyexcel", "import"]
    infer: "从已有导入代码和配置推断 Excel 导入框架与风格；区分 Jalor 内置 Servlet 路径 /servlet/upload?ulType=ExcelImport 与自定义导入 Controller；识别 ImportTask/ImportResult/临时表/结果表命名模式"
    spec_load_trigger: "项目无导入功能且 PRD 明确要求"

  # ===== Frontend =====
  - element_id: fe-tech-stack
    scan:
      - files: ["package.json"]
        extract: ["vue", "@aurora/vue-common", "@turboui/turbo-ui-cli-service", "vuex"]
      - files: ["lerna.json"]
        extract: ["lerna Monorepo"]
      - files: ["turboui.config.*"]
      - files: ["**/docs/init/THIRD_PARTY.md"]
        extract: ["核心组件库版本、依赖关系、package.json依赖清单"]
      - files: ["**/docs/init/ARCHITECTURE.md"]
        extract: ["前端分层架构、代码规范、命名约定、组件导入规范"]
    infer: "从前端依赖和构建配置推断技术栈（Vue2+AUI5+Starling/TurboUI 体系）"
    spec_load_trigger: "项目无前端或需技术栈迁移"

  - element_id: fe-page-structure
    scan:
      - files: ["**/cards/*/index.json"]
        extract: ["卡片 manifest：name/title/type/uemCode"]
      - files: ["turboui.config.*"]
        extract: ["packages 配置的卡片目录"]
      - files: ["**/docs/init/MODULE_INDEX.md"]
        extract: ["业务模块清单、页面路由、卡片三件套结构、子组件清单"]
    infer: "从卡片 manifest 和 turboui 配置推断页面结构（Starling 卡片注册机制）"
    spec_load_trigger: "无卡片注册可参照（全新前端）"

  - element_id: fe-component
    scan:
      - files: ["**/cards/*/index.vue", "**/cards/*/components/*.vue"]
        extract: ["卡片组件与子组件"]
      - files: ["**/docs/init/AUI_COMPONENTS.md"]
        extract: ["AUI组件使用总结、导入方式、常用属性、图标组件"]
    infer: "从现有卡片组件推断组件命名、字段绑定、校验模式；从卡片三件套(index.vue+index.ts+index.json)推断卡片开发规范"
    spec_load_trigger: "无现有组件可参照"

  - element_id: fe-api-binding
    scan:
      - files: ["**/util/service.ts", "**/util/service.js", "**/cards/*/api/*.js", "**/cards/*/api/*.ts"]
        grep: ["service.network", "$service", "axios", "fetch"]
        extract: ["service.network.get/post 封装", "API 路径前缀", "Starling $service 注入模式", "卡片级 API 模块"]
      - files: ["**/docs/init/AUI_SERVICES.md"]
        extract: ["useService()写法、service.network调用方式、API URL规律、错误处理方式"]
      - files: ["**/docs/init/FRONTEND_API.md"]
        extract: ["API接口清单、GET/POST请求示例、响应数据格式、调用注意事项"]
      - files: ["**/docs/init/FRONTEND_SERVICES.md"]
        extract: ["外部服务集成、EDM/SaasPortal/埋码服务、服务依赖关系"]
    infer: "从 API 封装层推断前后端交互模式（Starling $service 注入）"
    spec_load_trigger: "无 API 封装可参照（全新前端）"

  - element_id: fe-interaction-logic
    scan:
      - files: ["**/cards/*/index.vue"]
        grep: ["Modal.confirm", "Modal.message", "aui-dialog-box", "ElMessageBox", "loadingService"]
    infer: "从现有卡片交互推断交互模式（弹窗/抽屉/确认/校验提示）"
    spec_load_trigger: "无现有交互组件可参照"

  # ===== Integration =====
  - element_id: integration-external
    scan:
      - files: ["**/client/**/*.java", "**/delegate/**/*.java"]
        grep: ["RpcService", "BpmExtendService", "FeignClient", "RestTemplate"]
      - files: ["restService.properties", "remoteServer.properties"]
        extract: ["远程服务地址配置"]
      - files: ["**/specs/tech-arch/**/EXTERNAL_SERVICES.md"]
        extract: ["外部服务总览、RpcClient/SdkClient端点、防腐层映射、SDK依赖清单、配置项汇总"]
      - files: ["**/docs/init/EXTERNAL_SERVICES.md"]
        extract: ["外部服务总览、RpcClient/SdkClient端点、防腐层映射、SDK依赖清单、配置项汇总"]
      - files: ["**/docs/sys_kl/**/01_system_overview.md"]
        extract: ["外部依赖、系统集成点、跨域交互"]
      - files: ["**/docs/sys_kl/**/contexts/*/01_developer_guide.md"]
        extract: ["Delegate/RPC入口、外部服务调用锚点、防腐层实现"]
    infer: "从外部调用代码推断集成模式（Delegate/RPC）"
    spec_load_trigger: "PRD 要求对接新的外部系统"

  # ===== Config =====
  - element_id: config-app-config
    scan:
      - files: ["application.yml", "application-*.yml", "*.properties"]
      - files: ["**/config/datasource*.xml", "**/config/datasource*.configs.xml"]
        extract: ["多数据源配置"]
      - files: ["**/config/*.services.xml"]
        extract: ["服务 Bean 配置"]
    infer: "从现有配置项推断配置风格（命名、分组、默认值、properties/XML 混合方式）"
    spec_load_trigger: "无配置文件参照（全新项目）"

  - element_id: config-dict
    scan:
      - files: ["**/enums/**"]
        grep: ["enum"]
      - files: ["**/constant/**"]
        extract: ["常量枚举定义"]
    infer: "从现有枚举/常量推断字典定义模式（Java 枚举替代数据字典）"
    spec_load_trigger: "项目无字典模式且 PRD 含新枚举"

  - element_id: config-error-code
    scan:
      - files: ["**/exception/**", "**/error/**", "**/share/*Exception*"]
        grep: ["错误码", "errorCode", "BIZ_", "SYS_", "BusinessException", "BusinessExceptionAssert"]
    infer: "从现有错误码枚举推断编码规则"
    spec_load_trigger: "项目无错误码规范且 PRD 要求规范错误码"

  - element_id: config-permission
    scan:
      - files: ["**/permission/**"]
        grep: ["hasRole", "hasPermission", "RBAC", "权限", "hasRolePermission"]
      - files: ["**/share/delegate/*Permission*", "**/share/service/*User*"]
        extract: ["hasRole/hasRolePermission 等自定义权限判断方法"]
      - files: ["**/specs/tech-arch/**/ARCHITECTURE.md"]
        extract: ["API权限控制、安全规范、JWT认证配置"]
      - files: ["**/docs/init/ARCHITECTURE.md"]
        extract: ["API权限控制、安全规范、JWT认证配置"]
      - files: ["**/docs/sys_kl/**/semantic_core_package.md"]
        extract: ["权限相关业务规则、角色约束、访问控制策略"]
    infer: "从权限框架和自定义权限方法推断权限模型"
    spec_load_trigger: "项目无权限体系且 PRD 要求 RBAC"

  # ===== Data (Extended) =====
  - element_id: data-multi-datasource
    scan:
      - files: ["**/specs/tech-arch/**/DATABASE.md"]
        extract: ["多数据源配置、数据源数量、命名规则、连接池参数、跨数据源访问说明"]
      - files: ["**/config/datasource*.xml", "**/config/datasource*.configs.xml"]
        extract: ["多数据源配置：数据源数量、命名规则、连接池参数"]
      - files: ["application.yml", "application-*.yml", "application.properties"]
        grep: ["datasource", "spring.datasource", "DynamicDataSource", "AbstractRoutingDataSource"]
    infer: "从多数据源配置推断数据源划分策略与事务管理模式"
    spec_load_trigger: "PRD 要求新增数据源或调整数据源划分"

  # ===== Integration (Extended) =====
  - element_id: integration-async-message
    scan:
      - files: ["**/async.message.beans.xml", "**/config/async*"]
        extract: ["异步消息 Bean 配置"]
    infer: "从异步消息配置推断消息驱动架构（下载/导入等异步任务）"
    spec_load_trigger: "PRD 要求新增异步消息驱动场景"
