# 子要素注册表
# 挂载于 config.yaml → extension_registry.elements

# RESOLVE_ELEMENT(id):
#   row := elements 中 id==id OR aliases 含 id
#   IF composite_of 非空: RETURN 展开 composite_of
#   ELSE: RETURN spec_path, standard_path
#
# prd_sources:
#   required_sections: 子要素必须读取的 PRD 要素/小节（格式：element-id.L2.L2 中文名）
#   optional_sections: 有则读取、缺失不阻断的 PRD 要素/小节（格式：element-id.L2.L2 中文名）
#   extraction_keys: 从上述章节抽取的关键编号/业务信号

