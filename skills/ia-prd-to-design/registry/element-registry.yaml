      required_sections: ["product-positioning.1.3 范围和边界", "app-architecture.2.2 系统边界", "nfr.10.5 可维护性"]
      optional_sections: ["product-positioning.1.4 产品目标", "nfr.10.1 性能要求", "nfr.10.3 安全隐私", "integration-design.7.1 集成点"]
