# Subagent 注册表（唯一派发 SSOT）
# 挂载于 config.yaml → extension_registry.subagents
# 禁止写入 registry 段

subagents:
  - element_id: architecture
    name: ia-arch-designer
    artifact_key: architecture
    artifact_file: architecture.md
    chapter_no: 1
    optional: false
    element_ids:
      - arch-tech-stack
      - arch-deployment
      - arch-microservice
      - arch-feature-toggle
      - arch-code-structure
      - arch-common-lib
      - arch-common-component
    depends_on: []
    force_read:
      - "{PRD_FILE}"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]
      workflows: [design-new-build]

  - element_id: data-model
    name: ia-db-designer
    artifact_key: data-model
    artifact_file: data.md
    chapter_no: 2
    optional: false
    element_ids:
      - data-table
      - data-cache
      - data-state-machine
    depends_on: []
    force_read:
      - "{PRD_FILE}"
    force_read_by_mode:
      incremental:
        - "{DESIGN_DIR}/shared-context.md"
    optional_read:
      - "{DESIGN_DIR}/shared-context.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  - element_id: api-contract
    name: ia-api-designer
    artifact_key: api-contract
    artifact_file: backend-api.md
    chapter_no: 3
    optional: false
    element_ids:
      - be-api
    depends_on: [data-model]
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/data.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  - element_id: backend-impl
    name: ia-backend-designer
    artifact_key: backend-impl
    artifact_file: backend.md
    chapter_no: 4
    optional: false
    element_ids:
      - be-class
      - be-sequence
      - be-logic
      - be-transaction
      - be-export
      - be-import
      - be-schedule
      - be-workflow
    depends_on: [api-contract, data-model]
    select_when:
      backend_variant: standard
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/data.md"
      - "{DESIGN_DIR}/backend-api.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  - element_id: backend-impl
    name: ia-ap-designer
    artifact_key: backend-impl
    artifact_file: backend.md
    chapter_no: 4
    optional: false
    element_ids:
      - be-class
      - be-sequence
      - be-logic
      - be-transaction
      - be-export
      - be-import
      - be-schedule
      - be-workflow
    depends_on: [api-contract, data-model]
    select_when:
      backend_variant: ap
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/data.md"
      - "{DESIGN_DIR}/backend-api.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [AP]

  - element_id: integration
    name: ia-integration-designer
    artifact_key: integration
    artifact_file: integration.md
    chapter_no: 6
    optional: true
    element_ids:
      - integration-mq
      - integration-external
      - integration-notification
    depends_on: [backend-impl]
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/backend-api.md"
      - "{DESIGN_DIR}/backend.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  - element_id: config
    name: ia-config-designer
    artifact_key: config
    artifact_file: config.md
    chapter_no: 7
    optional: true
    element_ids:
      - config-app-config
      - config-dict
      - config-error-code
      - config-nfr-security
      - config-permission
    depends_on: [api-contract]
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/backend-api.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  - element_id: frontend
    name: ia-frontend-designer
    artifact_key: frontend
    artifact_file: frontend.md
    chapter_no: 5
    optional: false
    element_ids:
      - fe-tech-stack
      - fe-page-structure
      - fe-component
      - fe-api-binding
      - fe-interaction-logic
      - fe-nfr
    depends_on: [api-contract]
    select_when:
      has_frontend: true
    force_read:
      - "{PRD_FILE}"
      - "{DESIGN_DIR}/backend-api.md"
    optional_read:
      - "{DESIGN_DIR}/config.md"
    dispatch_profile:
      execution_modes: [build, modify, incremental]
      project_types: [TP, AP, AI]

  # ai-capability：待决策；一期默认不纳入 workflow
  # - element_id: ai-capability
  #   name: ia-ai-designer
  #   ...

  - dispatch_via: orchestration-direct
    name: ia-story-enricher
    orchestration_phases:
      - design-new-build/2B
      - design-incremental-build/3B
    force_read:
      - "{DESIGN_DIR}/design.md"
      - "{STORY_FILE}"

  - dispatch_via: orchestration-direct
    name: ia-dependency-analyzer
    orchestration_phases:
      - design-incremental-build/1
    force_read:
      - "{PRD_FILE}"
    dispatch_profile:
      optional: true
      phase: 2

  - dispatch_via: orchestration-direct
    name: ia-overall-designer
    orchestration_phases:
      - design-new-build/pre
      - design-new-build/0A
      - design-incremental-build/1A
    force_read:
      - "{PRD_FILE}"
    dispatch_profile:
      optional: true
      phase: 2
