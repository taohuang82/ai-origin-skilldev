workflows:
  - id: "design-resume"
    name: "设计续接恢复"
    priority: 100
    input_signature:
      required:
        - id: "DESIGN_DOC_INPROGRESS"
          reason: "存在未完成的设计主产物（design 域）。"
      excluded: []
      optional:
        - id: "PRD_DOC_ANY"
          reason: "可选：prd.md 仅作需求侧参考，辅助续写设计。"
    trigger_keywords: ["继续设计", "resume", "从上次继续", "接着写设计", "断点续作", "接着做"]
    orchestration_file: "orchestration/o-design-resume.md"
    resume_mode: true
    element_sequence: []
    status: "active"

  - id: "design-review-modify"
    name: "设计评审修改"
    priority: 80
    input_signature:
      required:
        - id: "DESIGN_HISTORICAL"
          reason: "修改对象是已完成态的设计基线（design.md）。"
        - id: "REVIEW_COMMENTS"
          reason: "必须有评审意见（文字描述或带标注文档均可，o-design-review-modify 内部区分）。"
      excluded:
        - id: "DESIGN_DOC_INPROGRESS"
          reason: "存在进行中设计时优先走续接恢复。"
      optional:
        - id: "PRD_DOC_ANY"
          reason: "可选：PRD 仅作需求对照参考。"
    trigger_keywords: ["评审修改设计", "根据评审意见", "按意见改设计", "修改设计文档", "按意见改", "有评审标注", "改 backend-api", "改设计文档"]
    orchestration_file: "orchestration/o-design-review-modify.md"
    element_sequence: []
    status: "active"

  - id: "design-incremental-build"
    name: "设计增量/更新"
    priority: 60
    input_signature:
      required:
        - id: "PRD_DOC_ANY"
          reason: "设计输入默认语义为增量；任何 PRD（无论是否显式标记 INCR）均优先走增量构建，无基线时以 PRD 为起点落成完整设计。"
      excluded:
        - id: "DESIGN_DOC_INPROGRESS"
          reason: "进行中则走续接恢复。"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时属于 design-review-modify 场景。"
        - id: "FULL_PRD_DOC"
          reason: "PRD 显式声明全量/新建时应走 design-new-build；未显式声明时默认按增量处理。"
        - id: "LIGHTWEIGHT_TRIGGER"
          reason: "轻量触发成立时由 design-lightweight-incremental 接管；避免标准增量与轻量增量同时候选"
      optional:
        - id: "PRD_DOC_COMPLETED"
          reason: "已定稿 PRD 可降低澄清成本。"
        - id: "INCR_PRD_DOC"
          reason: "含 DELTA / impact 元数据的 PRD 可加速变化点识别。"
    trigger_keywords: ["增量设计", "设计增量", "优化设计", "1-n", "在现有设计基础上", "update 设计", "DELTA", "影响域", "ChangeRouter", "PC-", "原子变化点"]
    orchestration_file: "orchestration/o-design-incremental-build.md"
    element_sequence: []
    status: "active"

  - id: "design-lightweight-incremental"
    name: "轻量增量设计（代码驱动）"
    priority: 58
    input_signature:
      required:
        - id: "PRD_DOC_ANY"
          reason: "存量系统增量走轻量模式"
        - id: "LIGHTWEIGHT_TRIGGER"
          reason: "轻量触发信号：US≤3 批量自动 / 用户显式指定 / 轻量语义关键词；由 input-type-registry detection 产出"
      excluded:
        - id: "DESIGN_DOC_INPROGRESS"
          reason: "存在进行中设计时优先走续接恢复"
        - id: "FULL_PRD_DOC"
          reason: "PRD 显式声明全量/新建时走 design-new-build"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时走 design-review-modify"
      optional:
        - id: "DESIGN_HISTORICAL"
          reason: "基线设计可作为增量对照"
        - id: "PRD_DOC_COMPLETED"
          reason: "已定稿 PRD 可降低澄清成本"
        - id: "STORY_FILE_PRESENT"
          reason: "story.md 存在时可做 US 批量判定"
    trigger_keywords: ["轻量设计", "轻量增量", "快速增量设计", "代码驱动增量", "轻量模式", "lightweight", "代码驱动设计", "从代码推断"]
    orchestration_file: "orchestration/o-design-lightweight.md"
    execution_profile_field: "lightweight_incremental"
    status: "active"

  - id: "design-new-build"
    name: "从 PRD 新建完整技术设计"
    priority: 40
    input_signature:
      required:
        - id: "FULL_PRD_DOC"
          reason: "仅有显式声明为非增量（全量/新建）的 PRD 才走新建设计；PRD 未标明时默认走增量构建。"
      excluded:
        - id: "DESIGN_DOC_INPROGRESS"
          reason: "存在进行中设计时优先走续接恢复。"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时属于 design-review-modify 场景。"
        - id: "INCR_PRD_DOC"
          reason: "PRD 含增量标记时强制走增量构建，不与新建流程竞争。"
      optional:
        - id: "PRD_DOC_COMPLETED"
          reason: "已定稿 PRD 可降低澄清成本，但不能单独作为新建设计判据。"
    trigger_keywords: ["PRD转设计", "生成技术方案", "新建设计", "ia-prd-to-design", "产品方案转设计", "需求转设计", "创建设计", "全量设计", "完整设计"]
    orchestration_file: "orchestration/o-design-new-build.md"
    element_sequence: []
    status: "active"
