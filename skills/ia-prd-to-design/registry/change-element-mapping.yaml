      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "certain"
        reason: "埋点触发点与交互流程绑定"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "conditional"
        condition: "若埋点数据需上报后端"

  # ─── AA 类 ────────────────────────────────────
  - change_id: "AA-01"
    affects:
      - element_id: "architecture"
        sub_element_ids: [arch-microservice]
        impact_level: "certain"
        reason: "系统边界变更直接影响服务边界划分"
      - element_id: "architecture"
        sub_element_ids: [arch-code-structure]
        impact_level: "likely"
        reason: "服务边界变化可能影响代码分层结构"
      - element_id: "integration"
        sub_element_ids: [integration-external]
        impact_level: "conditional"
        condition: "若架构变更影响系统依赖"
  - change_id: "AA-02"
    affects:
      - element_id: "architecture"
        sub_element_ids: [arch-microservice]
        impact_level: "likely"
        reason: "特性分类可能影响服务划分"
      - element_id: "architecture"
        sub_element_ids: [arch-code-structure]
        impact_level: "likely"
        reason: "包结构可能随特性层级调整"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "接口路径可能随特性编号调整"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "likely"
        reason: "权限矩阵可能按特性清单组织"

  # ─── CF 类 ────────────────────────────────────
  - change_id: "CF-01"
    affects:
      - element_id: "config"
        sub_element_ids: [config-app-config]
        impact_level: "certain"
        reason: "配置项清单直接变更"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "配置读取逻辑可能调整"
