# change-element-mapping.yaml
# Atomic change -> design sub-element impact mapping.
# element_id is kept as a compatibility field for existing orchestration/subagent dispatch.
# sub_element_ids align with element-registry.yaml; domain and parent_element_id are inferred from it.
#
# Field rules:
#   element_id        - compatible parent design element id used by existing workflows
#   sub_element_ids   - exactly one impacted child element id; orchestration resolves parent/domain from element-registry.yaml
#
# impact_level:
#   certain     - must execute
#   likely      - execute by default, user may skip
#   conditional - execute only when condition matches or user confirms

change_element_mappings:

  # ─── IA 类 ────────────────────────────────────
  - change_id: "IA-01"
    affects:
      - element_id: "data-model"
        sub_element_ids: [data-table]
        impact_level: "certain"
        reason: "新实体直接产生物理表设计"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "certain"
        reason: "新实体需要 Entity/DTO/VO 等类设计"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "certain"
        reason: "新实体通常需要 CRUD 或查询接口"
      - element_id: "config"
        sub_element_ids: [config-dict]
        impact_level: "conditional"
        condition: "若实体含枚举属性需数据字典"
      - element_id: "data-model"
        sub_element_ids: [data-cache]
        impact_level: "conditional"
        condition: "若新实体属于高频访问对象"
      - element_id: "data-model"
        sub_element_ids: [data-state-machine]
        impact_level: "conditional"
        condition: "若新实体含状态字段或生命周期"
  - change_id: "IA-02"
    affects:
      - element_id: "data-model"
        sub_element_ids: [data-table]
        impact_level: "certain"
        reason: "字段增减直接影响表结构"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "Entity/DTO/VO 字段通常需同步"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "接口入参出参可能随字段变化"
      - element_id: "config"
        sub_element_ids: [config-dict]
        impact_level: "conditional"
        condition: "若属性含枚举约束"
      - element_id: "data-model"
        sub_element_ids: [data-cache]
        impact_level: "conditional"
        condition: "若变更字段在缓存 Key 或 Value 中"
  - change_id: "IA-03"
    affects:
      - element_id: "data-model"
        sub_element_ids: [data-table]
        impact_level: "certain"
        reason: "外键、关联表或索引变更"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "certain"
        reason: "实体关联映射逻辑需要调整"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "关联查询接口可能变化"
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "conditional"
        condition: "若关系变更影响业务处理时序"
  - change_id: "IA-04"
    affects:
      - element_id: "data-model"
        sub_element_ids: [data-state-machine]
        impact_level: "certain"
        reason: "状态机定义直接变更"
      - element_id: "data-model"
        sub_element_ids: [data-table]
        impact_level: "likely"
        reason: "状态字段枚举值可能扩展"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "certain"
        reason: "状态流转逻辑需要实现"
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "likely"
        reason: "状态触发的处理时序可能变化"
      - element_id: "backend-impl"
        sub_element_ids: [be-workflow]
        impact_level: "conditional"
        condition: "若状态与审批流关联"
  - change_id: "IA-05"
    affects:
      - element_id: "config"
        sub_element_ids: [config-dict]
        impact_level: "certain"
        reason: "字典键值映射直接变更"
      - element_id: "data-model"
        sub_element_ids: [data-table]
        impact_level: "likely"
        reason: "字段约束可能调整"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "枚举类或校验逻辑可能调整"

  # ─── FS 类 ────────────────────────────────────
  - change_id: "FS-01"
    affects:
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "certain"
        reason: "新特性需要接口入口"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "certain"
        reason: "新特性需要业务类设计"
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "likely"
        reason: "新特性通常对应新页面或入口"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "likely"
        reason: "新特性通常需要权限配置"
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "likely"
        reason: "新页面通常需要交互定义"
      - element_id: "frontend"
        sub_element_ids: [fe-component]
        impact_level: "conditional"
        condition: "若新页面需要新增或复用前端组件"
  - change_id: "FS-02"
    affects:
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "certain"
        reason: "业务规则逻辑实现直接变更"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "规则变化可能影响接口校验"
      - element_id: "data-model"
        sub_element_ids: [data-cache]
        impact_level: "conditional"
        condition: "若规则涉及高频计算或缓存结果"
      - element_id: "config"
        sub_element_ids: [config-app-config]
        impact_level: "conditional"
        condition: "若规则阈值需要配置化"
  - change_id: "FS-03"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "certain"
        reason: "UIUX 操作流程直接变更"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "操作可能触发后端接口变化"
      - element_id: "data-model"
        sub_element_ids: [data-state-machine]
        impact_level: "conditional"
        condition: "若操作触发实体状态流转"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "操作对应的业务逻辑可能调整"
  - change_id: "FS-04"
    affects:
      - element_id: "backend-impl"
        sub_element_ids: [be-export]
        impact_level: "certain"
        reason: "导出方案直接变更"
      - element_id: "backend-impl"
        sub_element_ids: [be-import]
        impact_level: "certain"
        reason: "导入方案直接变更"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "certain"
        reason: "导入/导出接口定义直接变更"
      - element_id: "integration"
        sub_element_ids: [integration-async-message]
        impact_level: "conditional"
        condition: "若异步导入走消息驱动"
      - element_id: "integration"
        sub_element_ids: [integration-notification]
        impact_level: "conditional"
        condition: "若异步导入/导出需要通知下发"
  - change_id: "FS-05"
    affects:
      - element_id: "backend-impl"
        sub_element_ids: [be-schedule]
        impact_level: "certain"
        reason: "系统自动触发功能直接影响定时任务"
      - element_id: "config"
        sub_element_ids: [config-app-config]
        impact_level: "likely"
        reason: "任务周期、开关或重试通常需要配置项"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "任务执行逻辑可能需要类设计"
      - element_id: "integration"
        sub_element_ids: [integration-mq]
        impact_level: "conditional"
        condition: "若任务涉及异步消息"
  - change_id: "FS-06"
    affects:
      - element_id: "integration"
        sub_element_ids: [integration-notification]
        impact_level: "certain"
        reason: "通知渠道与文案直接变更"
      - element_id: "integration"
        sub_element_ids: [integration-mq]
        impact_level: "likely"
        reason: "异步通知链路可能变化"
      - element_id: "config"
        sub_element_ids: [config-app-config]
        impact_level: "conditional"
        condition: "若通知频控或模板参数可配置"

  # ─── UP 类 ────────────────────────────────────
  - change_id: "UP-01"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "certain"
        reason: "页面清单或路由入口直接变更"
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "certain"
        reason: "新增或删除页面影响页面交互与接口依赖"
      - element_id: "frontend"
        sub_element_ids: [fe-component]
        impact_level: "likely"
        reason: "新页面可能需要新增组件或复用组件盘点"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "页面通常对应后端接口"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "likely"
        reason: "页面菜单权限可能变化"
  - change_id: "UP-02"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "certain"
        reason: "页面字段或布局结构直接变更"
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "likely"
        reason: "字段布局变化可能影响交互流程"
      - element_id: "frontend"
        sub_element_ids: [fe-component]
        impact_level: "conditional"
        condition: "若新字段需要新增或调整组件"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "conditional"
        condition: "若字段增减影响接口参数"
  - change_id: "UP-03"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "certain"
        reason: "交互原型或 Pageflow 直接变更"
      - element_id: "frontend"
        sub_element_ids: [fe-component]
        impact_level: "conditional"
        condition: "若新交互需要新增或调整组件"
  - change_id: "UP-04"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "certain"
        reason: "菜单路由配置直接变更"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "certain"
        reason: "菜单可见性权限直接变更"
  - change_id: "UP-05"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-nfr]
        impact_level: "certain"
        reason: "兼容性要求直接影响前端非功能设计"
      - element_id: "frontend"
        sub_element_ids: [fe-tech-stack]
        impact_level: "conditional"
        condition: "若浏览器、终端或响应式要求影响技术选型"

  # ─── PD 类 ────────────────────────────────────
  - change_id: "PD-01"
    affects:
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "certain"
        reason: "角色清单或职责直接影响权限矩阵"
      - element_id: "backend-impl"
        sub_element_ids: [be-workflow]
        impact_level: "conditional"
        condition: "若角色与审批流节点关联"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "conditional"
        condition: "若角色变更涉及数据权限逻辑实现"
  - change_id: "PD-02"
    affects:
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "certain"
        reason: "功能权限矩阵直接变更"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "likely"
        reason: "接口鉴权注解可能变化"
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "likely"
        reason: "菜单或按钮可见性可能影响页面结构"
      - element_id: "frontend"
        sub_element_ids: [fe-component]
        impact_level: "likely"
        reason: "按钮权限可能影响组件展示"
  - change_id: "PD-03"
    affects:
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "certain"
        reason: "数据权限矩阵直接变更"
      - element_id: "config"
        sub_element_ids: [config-nfr-security]
        impact_level: "conditional"
        condition: "若涉及敏感字段脱敏规则"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "数据权限过滤逻辑可能调整"

  # ─── ID 类 ────────────────────────────────────
  - change_id: "ID-01"
    affects:
      - element_id: "integration"
        sub_element_ids: [integration-external]
        impact_level: "certain"
        reason: "外部服务依赖清单直接变更"
      - element_id: "architecture"
        sub_element_ids: [arch-microservice]
        impact_level: "likely"
        reason: "外部系统变化可能影响系统边界"
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "likely"
        reason: "新增外部调用链路可能影响处理时序"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "conditional"
        condition: "若需为外部系统提供内部适配接口"
  - change_id: "ID-02"
    affects:
      - element_id: "integration"
        sub_element_ids: [integration-mq]
        impact_level: "conditional"
        condition: "若集成点为异步集成"
      - element_id: "integration"
        sub_element_ids: [integration-external]
        impact_level: "conditional"
        condition: "若集成点为同步外部服务"
      - element_id: "backend-impl"
        sub_element_ids: [be-transaction]
        impact_level: "conditional"
        condition: "若集成涉及跨系统一致性"
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "likely"
        reason: "集成链路通常影响处理时序"
  - change_id: "ID-03"
    affects:
      - element_id: "integration"
        sub_element_ids: [integration-external]
        impact_level: "certain"
        reason: "外部接口契约直接变更"
      - element_id: "api-contract"
        sub_element_ids: [be-api]
        impact_level: "conditional"
        condition: "若内部适配接口需同步调整"

  # ─── SS 类 ────────────────────────────────────
  - change_id: "SS-01"
    affects:
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "certain"
        reason: "场景新增或流转变更直接影响时序图"
      - element_id: "integration"
        sub_element_ids: [integration-mq]
        impact_level: "conditional"
        condition: "若场景含异步触发事件"
      - element_id: "backend-impl"
        sub_element_ids: [be-class]
        impact_level: "likely"
        reason: "场景业务逻辑实现可能调整"
  - change_id: "SS-02"
    affects:
      - element_id: "config"
        sub_element_ids: [config-error-code]
        impact_level: "certain"
        reason: "异常场景直接影响错误码体系"
      - element_id: "backend-impl"
        sub_element_ids: [be-sequence]
        impact_level: "certain"
        reason: "异常分支时序直接变更"
      - element_id: "backend-impl"
        sub_element_ids: [be-transaction]
        impact_level: "conditional"
        condition: "若涉及跨服务异常补偿"
      - element_id: "integration"
        sub_element_ids: [integration-external]
        impact_level: "conditional"
        condition: "若涉及外部服务降级策略"
  - change_id: "SS-03"
    affects:
      - element_id: "backend-impl"
        sub_element_ids: [be-workflow]
        impact_level: "certain"
        reason: "审批流程定义直接变更"
      - element_id: "integration"
        sub_element_ids: [integration-notification]
        impact_level: "likely"
        reason: "审批通知可能变化"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "likely"
        reason: "审批角色权限可能变化"

  # ─── NF 类 ────────────────────────────────────
  - change_id: "NF-01"
    affects:
      - element_id: "config"
        sub_element_ids: [config-nfr-security]
        impact_level: "certain"
        reason: "性能指标直接变更"
      - element_id: "data-model"
        sub_element_ids: [data-cache]
        impact_level: "likely"
        reason: "性能要求可能触发缓存策略调整"
      - element_id: "architecture"
        sub_element_ids: [arch-deployment]
        impact_level: "conditional"
        condition: "若需调整资源配置或部署容量"
      - element_id: "architecture"
        sub_element_ids: [arch-tech-stack]
        impact_level: "conditional"
        condition: "若需引入新中间件或缓存层"
  - change_id: "NF-02"
    affects:
      - element_id: "config"
        sub_element_ids: [config-nfr-security]
        impact_level: "certain"
        reason: "安全隐私策略直接变更"
      - element_id: "config"
        sub_element_ids: [config-dict]
        impact_level: "conditional"
        condition: "若脱敏规则涉及新字段枚举或分类"
      - element_id: "architecture"
        sub_element_ids: [arch-tech-stack]
        impact_level: "conditional"
        condition: "若需新增安全组件或中间件"
      - element_id: "config"
        sub_element_ids: [config-permission]
        impact_level: "conditional"
        condition: "若涉及敏感数据脱敏角色"
  - change_id: "NF-03"
    affects:
      - element_id: "config"
        sub_element_ids: [config-nfr-security]
        impact_level: "certain"
        reason: "可用性或可维护性指标直接变更"
      - element_id: "architecture"
        sub_element_ids: [arch-deployment]
        impact_level: "conditional"
        condition: "若 SLA 变更导致部署架构调整"
      - element_id: "architecture"
        sub_element_ids: [arch-tech-stack]
        impact_level: "conditional"
        condition: "若需调整技术栈支撑可维护性"
  - change_id: "NF-04"
    affects:
      - element_id: "frontend"
        sub_element_ids: [fe-page-structure]
        impact_level: "likely"
        reason: "易用性要求可能影响页面布局"
      - element_id: "frontend"
        sub_element_ids: [fe-interaction-logic]
        impact_level: "likely"
        reason: "易用性要求可能影响交互步骤"
  - change_id: "NF-05"
    affects:
