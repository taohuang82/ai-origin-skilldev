# dependency-graph.yaml
# TDD sub-element dependency graph for Review ImpactRouter and incremental cascade checks.
# element is the parent-level compatibility field for subagent dispatch.
# sub_element_id is the real graph node from element-registry.yaml.
# domain and parent_element_id are inferred from element-registry.yaml.

impact_edges:
  - source:
      element: "data-model"
      sub_element_id: "data-table"
    targets:
      - element: "data-model"
        sub_element_id: "data-cache"
        impact_type: "direct"
        reason: "table fields and indexes affect cache key/value design"
      - element: "data-model"
        sub_element_id: "data-state-machine"
        impact_type: "direct"
        reason: "state fields are sourced from physical tables"
      - element: "api-contract"
        sub_element_id: "be-api"
        impact_type: "direct"
        reason: "table fields drive API request/response fields"
      - element: "backend-impl"
        sub_element_id: "be-class"
        impact_type: "direct"
        reason: "table structure affects Entity/DTO/VO fields"
      - element: "config"
        sub_element_id: "config-dict"
        impact_type: "indirect"
        reason: "field enum constraints may require data dictionary entries"

  - source:
      element: "data-model"
      sub_element_id: "data-state-machine"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-sequence"
        impact_type: "direct"
        reason: "state transitions affect processing sequence"
      - element: "backend-impl"
        sub_element_id: "be-logic"
        impact_type: "direct"
        reason: "state machine constrains business logic"
      - element: "integration"
        sub_element_id: "integration-mq"
        impact_type: "indirect"
        reason: "state transitions may publish async events"

  - source:
      element: "api-contract"
      sub_element_id: "be-api"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-class"
        impact_type: "direct"
        reason: "API contract drives Controller/Service class design"
      - element: "backend-impl"
        sub_element_id: "be-sequence"
        impact_type: "direct"
        reason: "API actions affect processing sequence"
      - element: "frontend"
        sub_element_id: "fe-api-binding"
        impact_type: "direct"
        reason: "frontend API binding depends on API list"
      - element: "config"
        sub_element_id: "config-permission"
        impact_type: "direct"
        reason: "API auth annotations depend on permission config"
      - element: "config"
        sub_element_id: "config-error-code"
        impact_type: "indirect"
        reason: "API error responses may introduce error codes"

  - source:
      element: "backend-impl"
      sub_element_id: "be-class"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-sequence"
        impact_type: "direct"
        reason: "class collaboration determines sequence participants"

  - source:
      element: "backend-impl"
      sub_element_id: "be-sequence"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-transaction"
        impact_type: "direct"
        reason: "call chain determines transaction boundary"
      - element: "integration"
        sub_element_id: "integration-mq"
        impact_type: "indirect"
        reason: "async sequence may use MQ"
      - element: "integration"
        sub_element_id: "integration-external"
        impact_type: "indirect"
        reason: "external calls in sequence affect external dependency list"

  - source:
      element: "backend-impl"
      sub_element_id: "be-schedule"
    targets:
      - element: "config"
        sub_element_id: "config-app-config"
        impact_type: "direct"
        reason: "schedule period, switch and retry often require config items"

  - source:
      element: "backend-impl"
      sub_element_id: "be-workflow"
    targets:
      - element: "config"
        sub_element_id: "config-permission"
        impact_type: "direct"
        reason: "workflow nodes are related to role permissions"
      - element: "integration"
        sub_element_id: "integration-notification"
        impact_type: "indirect"
        reason: "workflow may trigger notification"

  - source:
      element: "architecture"
      sub_element_id: "arch-tech-stack"
    targets:
      - element: "architecture"
        sub_element_id: "arch-deployment"
        impact_type: "direct"
        reason: "tech stack affects deployment design"
      - element: "architecture"
        sub_element_id: "arch-microservice"
        impact_type: "direct"
        reason: "tech constraints affect service governance and boundaries"
      - element: "architecture"
        sub_element_id: "arch-code-structure"
        impact_type: "indirect"
        reason: "tech stack may affect project layering"
      - element: "config"
        sub_element_id: "config-app-config"
        impact_type: "indirect"
        reason: "middleware selection may introduce config items"

  - source:
      element: "architecture"
      sub_element_id: "arch-microservice"
    targets:
      - element: "architecture"
        sub_element_id: "arch-code-structure"
        impact_type: "direct"
        reason: "service boundary determines code structure"
      - element: "api-contract"
        sub_element_id: "be-api"
        impact_type: "indirect"
        reason: "service boundary changes may affect API ownership"
      - element: "integration"
        sub_element_id: "integration-external"
        impact_type: "indirect"
        reason: "service boundary changes may affect external dependency"

  - source:
      element: "architecture"
      sub_element_id: "arch-code-structure"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-class"
        impact_type: "direct"
        reason: "code structure determines class package and dependency direction"

  - source:
      element: "frontend"
      sub_element_id: "fe-page-structure"
    targets:
      - element: "frontend"
        sub_element_id: "fe-component"
        impact_type: "direct"
        reason: "page structure determines component placement"
      - element: "frontend"
        sub_element_id: "fe-interaction-logic"
        impact_type: "direct"
        reason: "page routes and entries affect interaction logic"
      - element: "config"
        sub_element_id: "config-permission"
        impact_type: "direct"
        reason: "menu resource changes require permission matrix sync"

  - source:
      element: "frontend"
      sub_element_id: "fe-component"
    targets:
      - element: "frontend"
        sub_element_id: "fe-interaction-logic"
        impact_type: "direct"
        reason: "component fields and validation affect page state"
      - element: "frontend"
        sub_element_id: "fe-api-binding"
        impact_type: "direct"
        reason: "component fields usually bind to API data"

  - source:
      element: "frontend"
      sub_element_id: "fe-api-binding"
    targets:
      - element: "api-contract"
        sub_element_id: "be-api"
        impact_type: "indirect"
        reason: "frontend binding changes may reveal API gaps"

  - source:
      element: "integration"
      sub_element_id: "integration-mq"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-transaction"
        impact_type: "indirect"
        reason: "MQ flow may involve eventual consistency"
      - element: "integration"
        sub_element_id: "integration-notification"
        impact_type: "indirect"
        reason: "async events may trigger notification"

  - source:
      element: "integration"
      sub_element_id: "integration-external"
    targets:
      - element: "backend-impl"
        sub_element_id: "be-sequence"
        impact_type: "indirect"
        reason: "external service calls affect processing sequence"
      - element: "config"
        sub_element_id: "config-app-config"
        impact_type: "indirect"
        reason: "external endpoint, timeout and auth often require config"

  - source:
      element: "config"
      sub_element_id: "config-dict"
    targets:
      - element: "frontend"
        sub_element_id: "fe-component"
        impact_type: "indirect"
        reason: "dictionary values affect frontend display and options"
      - element: "backend-impl"
        sub_element_id: "be-class"
        impact_type: "indirect"
        reason: "dictionary values may affect enum classes"

  - source:
      element: "config"
      sub_element_id: "config-permission"
    targets:
      - element: "api-contract"
        sub_element_id: "be-api"
        impact_type: "indirect"
        reason: "permission changes may require API auth annotations"
      - element: "frontend"
        sub_element_id: "fe-page-structure"
        impact_type: "indirect"
        reason: "menu/button permissions affect frontend visibility"

  - source:
      element: "config"
      sub_element_id: "config-nfr-security"
    targets:
      - element: "frontend"
        sub_element_id: "fe-nfr"
        impact_type: "indirect"
        reason: "NFR and security requirements may affect frontend NFR design"
      - element: "architecture"
        sub_element_id: "arch-deployment"
        impact_type: "indirect"
        reason: "SLA or security boundary changes may affect deployment architecture"
