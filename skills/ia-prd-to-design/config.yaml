# ── 文档类型声明 ────────────────────────────────────────────────
skill_name: "ia-prd-to-design"
spec_compliance: "v1.6.0"
input_doc_type: "PRD"
output_doc_type: "DESIGN"

# ── 输出/输入路径 ────────────────────────────────────────────────
output_folder_base: "workspace/design"
input_folder_base: "workspace/design"

# ── 输出文件名模板 ───────────────────────────────────────────────
default_filename: "{primary_artifact}"
date_format: "YYYYMMDD"

# ── 引擎挂载点 ────────────────────────────────────────────────────
engine:
  workflow_engine: "engine/workflow-engine.md"

# ── 标准注册表挂载点 ──────────────────────────────────────────────
registry:
  workflows: "registry/workflow-registry.yaml"
  input_types: "registry/input-type-registry.yaml"

# ── Skill 扩展注册表（按需声明）─────────────────────────────────
extension_registry:
  dependency_graph: "registry/dependency-graph.yaml"
  atomic_changes: "registry/atomic-change-registry.yaml"
  change_element_mapping: "registry/change-element-mapping.yaml"
  subagents: "registry/subagent-registry.yaml"
  elements: "registry/element-registry.yaml"

# ── 规范资产路径 ─────────────────────────────────────────────────
standards:
  builtin_dir: "standards/"
  extend_index: "docs/extend-rule/INDEX.md"

# ── Skill 扩展配置：多文件设计输出（键与 subagent-registry artifact_key 对齐）──
design_artifacts:
  architecture: "architecture.md"
  data-model: "data.md"
  api-contract: "backend-api.md"
  backend-impl: "backend.md"
  integration: "integration.md"
  config: "config.md"
  frontend: "frontend.md"

# ── 运行时业务判定配置 ─────────────────────────────────────────────
# MODE 维度已由 workflow-registry 的 workflow ID 作为 SSOT 统一管理。
# execution_mode 由 workflow-engine Phase 2 根据命中 workflow 派生（build / incremental / modify / resume）。
# 要素的 mode 级过滤由 subagent-registry.yaml 的 dispatch_profile.workflows 与 dispatch_profile.execution_modes 控制。
runtime_dimensions:
  project_type:
    values: [TP, AP, AI]
    backend_variant:
      TP: standard
      AP: ap
      AI: standard
  change_scope:
    values: [frontend, backend, fullstack]
    sequence_exclusions:
      frontend:
        require_user_confirmation:
          - backend-impl
          - api-contract
      backend:
        exclude:
          - frontend
      fullstack:
        exclude: []
  execution_profile_fields:
    - has_frontend
    - has_backend
    - backend_variant
    - enable_ai

# ── 运行时上下文 ─────────────────────────────────────────────────
context:
  ongoing_file: "workspace/ongoing.md"
  biz_knowledge_library: "docs/biz_kl"

# ── 运行时默认值 ─────────────────────────────────────────────────
runtime_defaults:
  us_batch_size: 4
  update_design_accum: true
