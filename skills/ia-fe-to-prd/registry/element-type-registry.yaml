element_types:
  - id: "product-positioning"
    name: "定位与目标"
    chapter_no: 1
    chapter_no_cn: "一"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "1.1", name: "产品愿景" }
      - { l2_no: "1.2", name: "目标用户" }
      - { l2_no: "1.3", name: "痛点与需求" }
      - { l2_no: "1.4", name: "产品范围" }
      - { l2_no: "1.5", name: "目标与成功标准" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "产品愿景、用户、痛点、范围、目标与成功标准。"

  - id: "app-architecture"
    name: "应用架构"
    chapter_no: 2
    chapter_no_cn: "二"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "2.1", name: "系统模块" }
      - { l2_no: "2.2", name: "特性分类" }
      - { l2_no: "2.3", name: "特性清单" }
      - { l2_no: "2.4", name: "架构图" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "应用系统模块、特性分类、特性、子特性与架构图。"

  - id: "ui-prototype"
    name: "界面原型"
    chapter_no: 3
    chapter_no_cn: "三"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "3.1", name: "页面清单" }
      - { l2_no: "3.2", name: "页面流转图" }
      - { l2_no: "3.3", name: "菜单结构" }
      - { l2_no: "3.4", name: "HTML原型" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "页面清单、流转图、菜单结构与 HTML 原型。"

  - id: "info-architecture"
    name: "信息架构"
    chapter_no: 4
    chapter_no_cn: "四"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "4.1", name: "实体清单" }
      - { l2_no: "4.2", name: "ER图" }
      - { l2_no: "4.3", name: "实体详情" }
      - { l2_no: "4.4", name: "状态流转" }
      - { l2_no: "4.5", name: "数据样例" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "实体清单、ER 图、实体详情、状态流转、数据样例。"

  - id: "feature-spec"
    name: "功能特性"
    chapter_no: 5
    chapter_no_cn: "五"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "5.1", name: "子特性规格" }
      - { l2_no: "5.2", name: "实体操作" }
      - { l2_no: "5.3", name: "集成点" }
      - { l2_no: "5.4", name: "BDD验收标准" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "子特性的详细规格、实体操作、集成点与 BDD 验收标准。"

  - id: "permission-design"
    name: "权限设计"
    chapter_no: 6
    chapter_no_cn: "六"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "6.1", name: "角色定义" }
      - { l2_no: "6.2", name: "功能权限矩阵" }
      - { l2_no: "6.3", name: "数据权限" }
      - { l2_no: "6.4", name: "脱敏规则" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "角色定义、功能权限矩阵、数据权限与脱敏规则。"

  - id: "integration-design"
    name: "集成设计"
    chapter_no: 7
    chapter_no_cn: "七"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "7.1", name: "集成点" }
      - { l2_no: "7.2", name: "集成方式" }
      - { l2_no: "7.3", name: "接口规格" }
      - { l2_no: "7.4", name: "异常处理" }
    belongs_to: ["TP", "AP", "AI"]
    optional: true
    backend_only: false
    description: "集成点、集成方式、接口规格与异常处理。"

  - id: "config-design"
    name: "配置设计"
    chapter_no: 8
    chapter_no_cn: "八"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "8.1", name: "用户配置项" }
      - { l2_no: "8.2", name: "IT管理配置项" }
    belongs_to: ["TP", "AP"]
    optional: true
    backend_only: false
    description: "用户配置项与 IT 管理配置项。"

  - id: "scenario-solution"
    name: "场景解决方案"
    chapter_no: 9
    chapter_no_cn: "九"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "9.1", name: "端到端场景" }
      - { l2_no: "9.2", name: "场景串联" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "端到端场景串联子特性、实体与集成点。"

  - id: "nfr"
    name: "非功能需求"
    chapter_no: 10
    chapter_no_cn: "十"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "10.1", name: "DFX特性" }
      - { l2_no: "10.2", name: "量化验收标准" }
      - { l2_no: "10.3", name: "埋点设计" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "DFX 特性、量化验收标准与埋点设计。"

  - id: "story-design"
    name: "Story 设计"
    chapter_no: 11
    chapter_no_cn: "十一"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "11.1", name: "Story清单" }
      - { l2_no: "11.2", name: "Story详情" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    always_affected_in: ["modify", "incremental"]  # ⚠️ 在modify/incremental模式下永远受影响
    description: "基于功能特性与 NFR 拆分 Story 清单。"