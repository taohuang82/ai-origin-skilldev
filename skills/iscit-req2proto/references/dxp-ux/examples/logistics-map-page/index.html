<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>供应链全球运输监控大屏</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="ux-page">
      <div class="ux-content">
        <header class="ux-topbar" aria-label="页面头部">
          <div class="ux-topbar__left">
            <div class="ux-title">国家物流作战地图</div>
            <div class="ux-filters">
              <select class="ux-select" aria-label="客户">
                <option selected>Vodacom +2</option>
                <option>客户 A</option>
              </select>
              <select class="ux-select" aria-label="项目范围">
                <option selected>全部项目</option>
                <option>项目 1</option>
              </select>
            </div>
          </div>

          <div class="ux-topbar__right">
            <div class="ux-seg" role="tablist" aria-label="顶部模式">
              <button class="ux-seg__btn ux-seg__btn--active" type="button" role="tab" aria-selected="true">履行管理</button>
              <button class="ux-seg__btn" type="button" role="tab" aria-selected="false">业务运营</button>
              <button class="ux-seg__btn" type="button" role="tab" aria-selected="false">项目模拟</button>
              <button class="ux-seg__btn" type="button" role="tab" aria-selected="false">仓网设计</button>
            </div>
            <div class="ux-topbar__icons" aria-label="工具">
              <button class="ux-iconBtn" type="button" aria-label="全屏">⛶</button>
              <button class="ux-iconBtn" type="button" aria-label="更多">⋯</button>
            </div>
          </div>
        </header>

        <section class="ux-mapCanvas" aria-label="地图画布">
          <div class="ux-mapPanel">
            <div class="ux-mapPanel__header">
              <div class="ux-mapPanel__title">全球物流实时追踪</div>
              <div class="ux-mapPanel__right">
                <div class="ux-mapPanel__sub">异步加载 world.json（双 CDN 兜底）</div>
                <button id="ux-mapDrawerToggle" class="ux-btn ux-btn--ghost" type="button" aria-controls="ux-mapDrawer" aria-expanded="true">
                  面板
                </button>
              </div>
            </div>
            <div class="ux-mapPanel__body">
              <section id="ux-mapWorkflow" class="ux-workflow ux-workflow--mapOverlay" aria-label="物流流程导航">
                <button class="ux-iconBtn ux-iconBtn--ghost" type="button" aria-label="视图切换">▦</button>

                <div class="ux-workflow__track" role="list">
                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">✈</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">国际运输</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--warn">24</span>
                        <span class="ux-badge ux-badge--info">137</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                  </div>

                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">⚓</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">进口清关</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--warn">4</span>
                        <span class="ux-badge ux-badge--info">57</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                  </div>

                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">⛴</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">港到仓运输</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--warn">3</span>
                        <span class="ux-badge ux-badge--info">15</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                  </div>

                  <div class="ux-pill ux-pill--active" role="listitem" aria-current="step">
                    <div class="ux-pill__icon" aria-hidden="true">⌂</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">中心仓管理</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--danger">4</span>
                        <span class="ux-badge ux-badge--info">2</span>
                        <span class="ux-badge ux-badge--neutral">39</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                    <div class="ux-pill__caret" aria-hidden="true">▾</div>
                  </div>

                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">⌂</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">前置仓管理</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--danger">5</span>
                        <span class="ux-badge ux-badge--info">50</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                  </div>

                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">⛟</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">本地派送</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--danger">5</span>
                        <span class="ux-badge ux-badge--info">50</span>
                      </div>
                    </div>
                    <div class="ux-chevron" aria-hidden="true">›</div>
                  </div>

                  <div class="ux-pill" role="listitem">
                    <div class="ux-pill__icon" aria-hidden="true">📍</div>
                    <div class="ux-pill__body">
                      <div class="ux-pill__title">站点管理</div>
                      <div class="ux-pill__meta">
                        <span class="ux-badge ux-badge--danger">5</span>
                        <span class="ux-badge ux-badge--info">50</span>
                      </div>
                    </div>
                  </div>
                </div>

                <button class="ux-iconBtn ux-iconBtn--ghost" type="button" aria-label="筛选">⛃</button>
              </section>

              <aside id="ux-mapDrawer" class="ux-mapDrawer" aria-label="左侧弹窗">
                <div class="ux-mapDrawer__header">
                  <div class="ux-mapDrawer__title">仓点概览</div>
                  <button id="ux-mapDrawerClose" class="ux-mapDrawer__close" type="button" aria-label="关闭弹窗">×</button>
                </div>
                <div class="ux-mapDrawer__content">
                  <div class="ux-mapDrawer__kpiRow">
                    <div class="ux-kpiCard">
                      <div class="ux-kpiCard__label">在途批次</div>
                      <div class="ux-kpiCard__value">1,248</div>
                      <div class="ux-kpiCard__meta">+3.2%（近24h）</div>
                    </div>
                    <div class="ux-kpiCard">
                      <div class="ux-kpiCard__label">延误预警</div>
                      <div class="ux-kpiCard__value ux-kpiCard__value--danger">2</div>
                      <div class="ux-kpiCard__meta">重点关注港口</div>
                    </div>
                  </div>

                  <div class="ux-sectionTitle">关键节点</div>
                  <ul class="ux-miniList" role="list">
                    <li class="ux-miniList__item">
                      <span class="ux-dot ux-dot--info" aria-hidden="true"></span>
                      <span class="ux-miniList__name">上海港</span>
                      <span class="ux-miniList__meta">海运 · 580 批次</span>
                    </li>
                    <li class="ux-miniList__item">
                      <span class="ux-dot ux-dot--info" aria-hidden="true"></span>
                      <span class="ux-miniList__name">洛杉矶</span>
                      <span class="ux-miniList__meta">海运 · 280 批次</span>
                    </li>
                    <li class="ux-miniList__item">
                      <span class="ux-dot ux-dot--danger" aria-hidden="true"></span>
                      <span class="ux-miniList__name">延误-汉堡港</span>
                      <span class="ux-miniList__meta">风险 · 60</span>
                    </li>
                  </ul>

                  <div class="ux-sectionTitle">快捷操作</div>
                  <div class="ux-actions">
                    <button class="ux-btn ux-btn--primary" type="button">查看明细</button>
                    <button class="ux-btn" type="button">导出</button>
                  </div>
                </div>
              </aside>
              <div id="chart-map" class="ux-chartMap" role="img" aria-label="世界地图与航线示意"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>
      // 参考 template-ap_new-...html 「3. 全球物流实时追踪（异步加载世界地图）」
      var DARK_THEME = {
        backgroundColor: "transparent",
        textStyle: {
          color: "rgba(180,220,255,0.65)",
          fontFamily: "'PingFang SC','Microsoft YaHei',Arial,sans-serif"
        },
        color: ["#00D4FF", "#00E676", "#FFD600", "#FF3D57", "#60B0FF", "#FF6D00"]
      };

      function mergeOption(base, extra) {
        var out = {};
        for (var k in base) {
          if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
        }
        for (var j in extra) {
          if (Object.prototype.hasOwnProperty.call(extra, j)) out[j] = extra[j];
        }
        return out;
      }

      function makeChart(id) {
        var el = document.getElementById(id);
        if (!el || typeof window.echarts === "undefined") return null;
        return window.echarts.init(el, null, { renderer: "canvas" });
      }

      var chartMap = makeChart("chart-map");
      if (chartMap) {
        chartMap.showLoading({
          text: "地图加载中...",
          color: "#1677FF",
          textColor: "#666666",
          maskColor: "rgba(255,255,255,0.92)"
        });

        var MAP_URLS = [
          "https://echarts.apache.org/examples/data/asset/geo/world.json",
          "https://cdn.jsdelivr.net/npm/echarts-map@3.0.1/json/world.json"
        ];

        function fetchMapJson(urls) {
          return urls.reduce(function (promise, url) {
            return promise.catch(function () {
              return fetch(url).then(function (r) {
                if (!r.ok) throw new Error(String(r.status));
                return r.json();
              });
            });
          }, Promise.reject());
        }

        fetchMapJson(MAP_URLS)
          .then(function (worldJson) {
            window.echarts.registerMap("world", worldJson);
            chartMap.hideLoading();

            var portNodes = [
              { name: "上海", value: [121.47, 31.23, 580] },
              { name: "广州", value: [113.26, 23.12, 420] },
              { name: "宁波", value: [121.55, 29.87, 310] },
              { name: "深圳", value: [114.07, 22.62, 350] },
              { name: "洛杉矶", value: [-118.24, 34.05, 280] },
              { name: "汉堡", value: [10.0, 53.55, 210] },
              { name: "新加坡", value: [103.82, 1.35, 190] },
              { name: "迪拜", value: [55.3, 25.2, 120] },
              { name: "鹿特丹", value: [4.48, 51.9, 160] },
              { name: "纽约", value: [-74.0, 40.71, 140] },
              { name: "东京", value: [139.69, 35.69, 200] },
              { name: "悉尼", value: [151.21, -33.87, 110] },
              { name: "孟买", value: [72.88, 19.08, 95] }
            ];
            var airNodes = [
              { name: "浦东机场", value: [121.8, 31.14, 180] },
              { name: "法兰克福机场", value: [8.57, 50.03, 150] },
              { name: "香港机场", value: [113.91, 22.31, 130] },
              { name: "仁川机场", value: [126.45, 37.47, 100] }
            ];
            var delayNodes = [
              { name: "延误-洛杉矶", value: [-118.24, 33.9, 80] },
              { name: "延误-汉堡港", value: [9.9, 53.5, 60] }
            ];

            var seaRoutes = [
              { coords: [[121.47, 31.23], [-118.24, 34.05]], lineStyle: { color: "#00D4FF" } },
              { coords: [[121.47, 31.23], [10.0, 53.55]], lineStyle: { color: "#00D4FF" } },
              { coords: [[113.26, 23.12], [103.82, 1.35]], lineStyle: { color: "#00D4FF" } },
              { coords: [[121.55, 29.87], [4.48, 51.9]], lineStyle: { color: "#00D4FF" } },
              { coords: [[114.07, 22.62], [55.3, 25.2]], lineStyle: { color: "#00D4FF" } },
              { coords: [[103.82, 1.35], [151.21, -33.87]], lineStyle: { color: "#00D4FF" } },
              { coords: [[72.88, 19.08], [55.3, 25.2]], lineStyle: { color: "#00D4FF" } }
            ];
            var airRoutes = [
              { coords: [[121.8, 31.14], [8.57, 50.03]], lineStyle: { color: "#00E676" } },
              { coords: [[113.91, 22.31], [139.69, 35.69]], lineStyle: { color: "#00E676" } },
              { coords: [[126.45, 37.47], [-74.0, 40.71]], lineStyle: { color: "#00E676" } }
            ];

            chartMap.setOption(
              mergeOption(DARK_THEME, {
                backgroundColor: "#FFFFFF",
                geo: {
                  map: "world",
                  silent: true,
                  roam: false,
                  top: 10,
                  bottom: 10,
                  left: 10,
                  right: 10,
                  label: { show: false },
                  itemStyle: {
                    areaColor: "#FFFFFF",
                    borderColor: "rgba(25,25,25,0.12)",
                    borderWidth: 0.6
                  },
                  emphasis: { itemStyle: { areaColor: "#F5F5F5" } }
                },
                tooltip: {
                  trigger: "item",
                  backgroundColor: "rgba(255,255,255,0.96)",
                  borderColor: "#EEEEEE",
                  textStyle: { color: "#333333", fontSize: 12 },
                  formatter: function (p) {
                    if (p.seriesType === "lines") return "";
                    if (p.value && p.value[2] !== undefined) {
                      return p.name + "<br/>货运量：" + p.value[2] + " 批次";
                    }
                    return p.name;
                  }
                },
                series: [
                  {
                    name: "海运港口",
                    type: "effectScatter",
                    coordinateSystem: "geo",
                    data: portNodes,
                    symbolSize: function (val) {
                      return Math.max(6, Math.sqrt(val[2]) * 1.1);
                    },
                    showEffectOn: "render",
                    rippleEffect: { brushType: "stroke", scale: 3, period: 4 },
                    itemStyle: { color: "#00D4FF", shadowBlur: 10, shadowColor: "#00D4FF" },
                    zlevel: 2
                  },
                  {
                    name: "海运航线",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 1,
                    effect: {
                      show: true,
                      period: 5,
                      trailLength: 0.15,
                      symbol: "arrow",
                      symbolSize: 5,
                      color: "#00D4FF"
                    },
                    lineStyle: { width: 1.2, opacity: 0.3, curveness: 0.25 },
                    data: seaRoutes
                  },
                  {
                    name: "空运机场",
                    type: "scatter",
                    coordinateSystem: "geo",
                    data: airNodes,
                    symbolSize: function (val) {
                      return Math.max(6, Math.sqrt(val[2]));
                    },
                    itemStyle: {
                      color: "#00E676",
                      shadowBlur: 8,
                      shadowColor: "#00E676",
                      opacity: 0.9
                    },
                    symbol: "diamond",
                    zlevel: 2
                  },
                  {
                    name: "空运航线",
                    type: "lines",
                    coordinateSystem: "geo",
                    zlevel: 1,
                    effect: {
                      show: true,
                      period: 3,
                      trailLength: 0.2,
                      symbol: "triangle",
                      symbolSize: 4,
                      color: "#00E676"
                    },
                    lineStyle: {
                      width: 1,
                      opacity: 0.25,
                      curveness: 0.3,
                      type: "dashed"
                    },
                    data: airRoutes
                  },
                  {
                    name: "延误预警",
                    type: "effectScatter",
                    coordinateSystem: "geo",
                    data: delayNodes,
                    symbolSize: 14,
                    showEffectOn: "render",
                    rippleEffect: { brushType: "fill", scale: 5, period: 2 },
                    itemStyle: { color: "#FF3D57", shadowBlur: 14, shadowColor: "#FF3D57" },
                    zlevel: 3
                  }
                ]
              }),
              true
            );
          })
          .catch(function () {
            chartMap.hideLoading();
            chartMap.setOption(
              mergeOption(DARK_THEME, {
                backgroundColor: "#FFFFFF",
                title: {
                  text: "地图数据加载失败，请检查网络",
                  left: "center",
                  top: "center",
                  textStyle: { color: "#999999", fontSize: 14 }
                }
              }),
              true
            );
          });

        window.addEventListener("resize", function () {
          chartMap.resize();
        });
      }

      (function () {
        var bar = document.getElementById("ux-mapWorkflow");
        var body = document.querySelector(".ux-mapPanel__body");
        if (bar && body) {
          function syncTransportOffset() {
            var h = bar.offsetHeight;
            body.style.setProperty("--ux-transport-offset", 20 + h + "px");
          }
          syncTransportOffset();
          window.addEventListener("resize", syncTransportOffset);
          if (typeof ResizeObserver !== "undefined") {
            new ResizeObserver(syncTransportOffset).observe(bar);
          }
        }
      })();

      (function () {
        var drawer = document.getElementById("ux-mapDrawer");
        var btnToggle = document.getElementById("ux-mapDrawerToggle");
        var btnClose = document.getElementById("ux-mapDrawerClose");
        if (!drawer || !btnToggle || !btnClose) return;

        function setOpen(open) {
          if (open) drawer.classList.remove("ux-mapDrawer--collapsed");
          else drawer.classList.add("ux-mapDrawer--collapsed");
          btnToggle.setAttribute("aria-expanded", open ? "true" : "false");
        }

        btnToggle.addEventListener("click", function () {
          setOpen(drawer.classList.contains("ux-mapDrawer--collapsed"));
        });
        btnClose.addEventListener("click", function () {
          setOpen(false);
        });
      })();
    </script>
  </body>
</html>
