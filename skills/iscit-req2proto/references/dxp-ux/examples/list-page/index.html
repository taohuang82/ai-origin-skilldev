<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>供需审视分析列表</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="ux-page">
      <div class="ux-content">
        <header class="ux-pageHeader ux-pageHeader--compact">
          <div class="ux-pageHeader__title">
            <h1 class="ux-h1">供需审视分析列表</h1>
          </div>
        </header>

        <section class="ux-card ux-card--padded" aria-label="统计与列表">
          <div class="ux-card__body">
            <!-- list-page 四层模式 L0（可选）：视图/统计 Tab -->
            <nav class="ux-tabs" aria-label="统计标签">
              <button class="ux-tab ux-tab--active" type="button">全量数据（15386）</button>
              <button class="ux-tab" type="button">关键 DO 可筛选（6173）</button>
              <button class="ux-tab" type="button">专项度阅读（1109）</button>
              <button class="ux-tab" type="button">风险等级筛选（121）</button>
            </nav>

            <!-- list-page L1：顶部操作列 -->
            <div class="ux-toolbar" aria-label="工具栏">
              <div class="ux-toolbar__left">
                <button class="ux-btn ux-btn--secondary" type="button">AI 生成供需审视分析</button>
                <button class="ux-btn ux-btn--secondary" type="button">关闭</button>
                <button class="ux-btn ux-btn--secondary" type="button">导出</button>
              </div>
            </div>

            <!-- list-page L2：筛选区（综合搜索/高级搜索；设置 icon 须在本区） -->
            <section class="ux-searchRow" aria-label="搜索">
              <div class="ux-search">
                <span class="ux-search__icon" aria-hidden="true">⌕</span>
                <input class="ux-search__input" type="text" placeholder="输入关键字搜索，过滤" />
                <button class="ux-search__suffixBtn" type="button" aria-label="清空">×</button>
              </div>
              <button class="ux-linkBtn" type="button">高级搜索</button>
              <button class="ux-iconBtn" type="button" aria-label="刷新">⟳</button>
              <button class="ux-iconBtn" type="button" aria-label="设置">⚙</button>
            </section>

            <section class="ux-tableBlock" aria-label="数据表格">
              <!-- list-page L3：表格内容区（仅表体，不含分页控件） -->
              <div class="ux-tableWrap" role="region" aria-label="表格滚动容器" tabindex="0">
                <table class="ux-table ux-table--dense">
                  <thead>
                    <tr>
                      <th class="ux-th ux-th--checkbox"><input type="checkbox" aria-label="全选" /></th>
                      <th class="ux-th ux-th--sortable">
                        ITEM 编码
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        专项度
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        LT
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        部件分类
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        风险等级
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        风险变更趋势
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        月均需求
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        月均出货
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        细颗粒 DO
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        DO HMINI 消耗
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--sortable">
                        审核方式
                        <span class="ux-sort" aria-hidden="true">⇅</span>
                      </th>
                      <th class="ux-th ux-th--actions">操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td class="ux-td ux-td--checkbox"><input type="checkbox" aria-label="选择行" /></td>
                      <td><a class="ux-linkText" href="#">32030087-00T</a></td>
                      <td>
                        <div class="ux-progress" aria-label="专项度 13%">
                          <div class="ux-progress__bar" style="width: 13%"></div>
                        </div>
                        <div class="ux-cellSub">13%</div>
                      </td>
                      <td>46</td>
                      <td>一级器件</td>
                      <td><span class="ux-risk ux-risk--low"><span class="ux-risk__dot" aria-hidden="true"></span>低风险</span></td>
                      <td><span class="ux-trend ux-trend--up" aria-label="上升">↑</span></td>
                      <td>6450</td>
                      <td>3703.6</td>
                      <td>0.7</td>
                      <td>1.3</td>
                      <td>单策略审核</td>
                      <td class="ux-table__actions">
                        <button class="ux-linkTextBtn" type="button">更多</button>
                        <span class="ux-caret" aria-hidden="true">▾</span>
                      </td>
                    </tr>
                    <tr>
                      <td class="ux-td ux-td--checkbox"><input type="checkbox" aria-label="选择行" /></td>
                      <td><a class="ux-linkText" href="#">32030087-00T</a></td>
                      <td>
                        <div class="ux-progress" aria-label="专项度 22%">
                          <div class="ux-progress__bar" style="width: 22%"></div>
                        </div>
                        <div class="ux-cellSub">22%</div>
                      </td>
                      <td>35</td>
                      <td>一级器件</td>
                      <td><span class="ux-risk ux-risk--mid"><span class="ux-risk__dot" aria-hidden="true"></span>中风险</span></td>
                      <td><span class="ux-trend ux-trend--flat" aria-label="稳定">→</span></td>
                      <td><span class="ux-emptyCell">--</span></td>
                      <td>31.4</td>
                      <td>5.2</td>
                      <td>1.7</td>
                      <td>组策略审核</td>
                      <td class="ux-table__actions">
                        <button class="ux-linkTextBtn" type="button">更多</button>
                        <span class="ux-caret" aria-hidden="true">▾</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- list-page L4：底部 pager 区 -->
              <div class="ux-tableFooter" aria-label="表格底部">
                <div class="ux-tableFooter__left">
                  <span class="ux-metaText">总条数 153</span>
                  <span class="ux-metaText">已选 0</span>
                </div>

                <div class="ux-pagination ux-pagination--right" aria-label="分页">
                  <div class="ux-pagination__controls">
                    <select class="ux-select ux-select--small" aria-label="每页条数">
                      <option selected>10</option>
                      <option>20</option>
                      <option>50</option>
                    </select>
                    <button class="ux-iconBtn ux-iconBtn--ghost" type="button" aria-label="上一页">‹</button>
                    <div class="ux-pagination__pages" aria-label="页码">
                      <button class="ux-pageBtn" type="button">1</button>
                      <button class="ux-pageBtn" type="button">2</button>
                      <button class="ux-pageBtn" type="button">…</button>
                      <button class="ux-pageBtn ux-pageBtn--active" type="button">14</button>
                      <button class="ux-pageBtn" type="button">15</button>
                      <button class="ux-pageBtn" type="button">16</button>
                    </div>
                    <button class="ux-iconBtn ux-iconBtn--ghost" type="button" aria-label="下一页">›</button>
                    <div class="ux-metaText">跳至</div>
                    <input class="ux-input ux-input--small" type="text" value="10" aria-label="跳转页码" />
                    <div class="ux-metaText">页</div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
