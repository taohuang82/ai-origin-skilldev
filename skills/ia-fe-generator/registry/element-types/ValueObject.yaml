  - { name: immutable, type: bool, required: true, desc: 不可变 }
  - { name: equality, type: enum, required: true, enum: [by_value], desc: 相等性 }
  - name: fields
    type: array<object>
    required: true
    sub_fields:
      - { name: name, type: string, required: true }
      - { name: type, type: string, required: true }
relations_held: []
stage_increments: {}
