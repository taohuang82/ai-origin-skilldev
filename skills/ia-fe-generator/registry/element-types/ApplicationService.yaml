element_type: ApplicationService
name_cn: 应用服务
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: true, relation: part_of, target: Domain, desc: 归属领域 }
  - { name: use_case, type: string, required: true, desc: 用例 }
  - { name: orchestration_steps, type: array, required: true, desc: 编排步骤（有序） }
  - name: orchestration_uses
    type: object
    required: true
    sub_fields:
      - { name: services,     type: array, required: false, relation: uses, target: DomainService, desc: 编排的领域服务 }
      - { name: repositories, type: array, required: false, relation: uses, target: Repository, desc: 编排的仓储 }
  - { name: uses_integrations, type: array, required: false, relation: uses, target: Integration, desc: 编排调用的集成 }
  - { name: involves_aggregates, type: array, required: true, relation: depends_on, target: Aggregate, desc: 涉及聚合 }
  - { name: transaction_boundary, type: object, required: true, desc: "{ propagation, rollback_for }" }
  - { name: commands, type: array, required: false, desc: Command 子结构 }
relations_held:
  - { relation: part_of,    target: Domain,            via: domain,                          seq: 4 }
  - { relation: depends_on, target: Aggregate,         via: involves_aggregates,             seq: 25 }
  - { relation: uses,       target: DomainService,     via: "orchestration_uses.services",     seq: 20 }
  - { relation: uses,       target: Repository,        via: "orchestration_uses.repositories", seq: 21 }
  - { relation: uses,       target: Integration,       via: uses_integrations,               seq: 22 }
stage_increments: {}
