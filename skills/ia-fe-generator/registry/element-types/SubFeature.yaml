element_type: SubFeature
name_cn: 子特性
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: fr_code, type: string, required: true, desc: 功能需求编号 FR-xxx }
  - { name: feature, type: string, required: true, relation: part_of, target: Feature, desc: 归属特性（domain 链式推，不存自身 domain） }
  - { name: business_description, type: string, required: true, desc: "FE 萌芽：业务描述" }
  - { name: page_operations, type: string, required: false, desc: "PRD 补：页面操作" }
  - { name: entity_operations, type: string, required: false, desc: "PRD 补：实体操作" }
  - { name: logic_description, type: string, required: false, desc: "PRD 补：处理逻辑" }
  - { name: referenced_rules, type: array, required: false, relation: uses, target: BusinessRule, desc: 引用业务规则 }
  - { name: performed_by_roles, type: array, required: false, relation: uses, target: Role, desc: 执行角色 }
  - { name: integration_points, type: array, required: false, relation: uses, target: Integration, desc: 集成点 }
  - { name: priority, type: enum, required: false, enum: [P0, P1, P2], desc: 优先级 }
  - name: acceptance_criteria
    type: array<object>
    required: false
    desc: "PRD 补：BDD 验收标准"
    sub_fields:
      - { name: ac_id, type: string, required: true }
      - { name: given, type: string, required: true }
      - { name: when,  type: string, required: true }
      - { name: then,  type: string, required: true }
relations_held:
  - { relation: part_of, target: Feature,      via: feature,            seq: 3 }
  - { relation: uses,    target: BusinessRule, via: referenced_rules,   seq: 10 }
  - { relation: uses,    target: Role,         via: performed_by_roles, seq: 11 }
  - { relation: uses,    target: Integration,  via: integration_points, seq: 12 }
stage_increments:
  FE:  [fr_code, feature, business_description, performed_by_roles]
  PRD: [page_operations, entity_operations, logic_description, referenced_rules, integration_points, priority, acceptance_criteria]
