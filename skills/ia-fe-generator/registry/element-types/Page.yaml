element_type: Page
name_cn: 页面
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: false, relation: part_of, target: 前端模块, desc: 前端模块逻辑归属（弱 part_of） }
  - { name: page_type, type: string, required: true, desc: 表单页/列表页等 }
  - { name: route_path, type: string, required: true, desc: 路由 }
  - { name: realizes_sub_features, type: array, required: true, relation: realizes, target: SubFeature, desc: 实现的子特性 }
  - name: fields
    type: array<object>
    required: false
    desc: "PRD 补：页面字段"
    sub_fields:
      - { name: name,       type: string, required: true }
      - { name: type,       type: string, required: true, desc: 控件 }
      - { name: required,   type: bool,   required: false }
      - { name: validation, type: string, required: false }
  - { name: used_components, type: array, required: false, relation: uses, target: Component, desc: "PRD/TDD 补：引用组件" }
  - { name: called_apis, type: array, required: false, relation: uses, target: API, desc: "TDD 后填：调用接口" }
  - name: fool_proofing
    type: array<object>
    required: false
    sub_fields:
      - { name: scene,    type: string, required: true }
      - { name: strategy, type: string, required: true }
  - { name: pageflow, type: object, required: false, desc: "{ flows_to: [{ target, trigger }] }" }
relations_held:
  - { relation: realizes, target: SubFeature, via: realizes_sub_features, seq: 28 }
  - { relation: uses,     target: Component,  via: used_components,        seq: 14 }
  - { relation: uses,     target: API,        via: called_apis,           seq: 13 }
  - { relation: part_of,  target: 前端模块,    via: domain,                 seq: 6 }
stage_increments:
  FE:  [domain, page_type, route_path, realizes_sub_features]
  PRD: [fields, used_components, called_apis, fool_proofing, pageflow]
