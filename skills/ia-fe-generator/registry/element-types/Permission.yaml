element_type: Permission
name_cn: 权限模型
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: true, relation: part_of, target: Domain, desc: 归属领域（一域一实例） }
  - name: function_permissions
    type: array<object>
    required: true
    desc: 功能权限点
    sub_fields:
      - { name: code, type: string, required: true }
      - { name: name, type: string, required: true }
      - { name: from_sub_feature, type: string, required: true, relation: realizes, target: SubFeature, desc: 来源子特性 }
  - name: role_permission_matrix
    type: array<object>
    required: true
    sub_fields:
      - { name: role, type: string, required: true, relation: uses, target: Role }
      - { name: permissions, type: array, required: true }
  - name: data_permissions
    type: array<object>
    required: false
    sub_fields:
      - { name: dimension, type: string, required: true }
      - { name: rule, type: string, required: true }
      - { name: applies_to_roles, type: array, required: true, relation: uses, target: Role }
relations_held:
  - { relation: part_of,  target: Domain,     via: domain,                                  seq: 4 }
  - { relation: realizes, target: SubFeature, via: "function_permissions[].from_sub_feature", seq: 29 }
  - { relation: uses,     target: Role,        via: "role_permission_matrix[].role",          seq: 15 }
  - { relation: uses,     target: Role,        via: "data_permissions[].applies_to_roles",    seq: 15 }
stage_increments: {}
