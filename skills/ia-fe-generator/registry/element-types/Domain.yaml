  - { name: short_description, type: string, required: true, desc: 领域职责 }
  - name: boundary_with_other_domains
    type: array<object>
    required: false
    desc: 领域间协作（非要素边，汇入 ProductOverview.domain_context_map）
    sub_fields:
      - { name: domain,   type: string, required: true }
      - { name: relation, type: enum,   required: true, enum: [上游, 下游] }
      - { name: mode,     type: string, required: true, desc: "事件驱动/防腐层/接口调用等" }
relations_held:
  - { relation: uses, target: Domain, via: boundary_with_other_domains, seq: 36 }
stage_increments: {}
