element_type: ProductOverview
name_cn: 产品总览
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: positioning, type: string, required: true, desc: 产品定位 }
  - name: scope
    type: object
    required: true
    sub_fields:
      - { name: included, type: array, required: true }
      - { name: excluded, type: array, required: true }
  - { name: application_architecture_mermaid, type: string, required: false, desc: "PRD 补：应用架构图（应用→域→特性→子特性）" }
  - { name: data_architecture_ldm_mermaid, type: string, required: false, desc: "PRD 补：逻辑数据模型 LDM 图" }
  - name: domain_context_map
    type: array<object>
    required: false
    desc: 领域间协作（由各 Domain.boundary 汇总，非要素边）
    sub_fields:
      - { name: from, type: string, required: true }
      - { name: to,   type: string, required: true }
      - { name: mode, type: string, required: true }
relations_held: []
stage_increments:
  FE:  [positioning, scope]
  PRD: [application_architecture_mermaid, data_architecture_ldm_mermaid, domain_context_map]
