# element-type-registry.yaml —— M3 共享身份索引（25 类，测试三要素暂缓）
# 唯一权威源在 docs/shared-metamodel/，物理复制进各 Skill registry/。
# 不含章节信息（在各 Skill doc-chapter-layout.yaml）、不含实现映射（在各 Skill spec-template-registry.yaml）、不绑 Skill。
spec_version: "1.0.0"

