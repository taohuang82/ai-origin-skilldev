# ia-fe-generator · config.yaml
# ── 文档类型 ──
output_doc_type: "FE"

# ── 路径 ──
output_folder_base: "workspace/requirements"        # 输出基础路径，版本目录由 ongoing.current_version 决定
input_folder_base: "workspace/raw_requirements"     # 原始需求文档存放路径
default_filename: "fe.md"                           # FE 单文档文件名

# ── 执行模式 ──
# subagent：每个要素通过 Agent 工具派发 subAgent 执行（省上下文，交互有延迟）
# inline：  主 agent 直接读取 spec 按模板执行（响应快，消耗上下文）
# 要素级覆盖：spec-template-registry 中 execution.dispatch 可覆盖此全局值
execution_dispatch: "inline"

# ── 引擎挂载（键名禁改）──
engine:
  workflow_engine: "engine/workflow-engine.md"
  element_runner:  "engine/element-runner.md"       # subAgent 执行模板；无 standards_loader

# ── 注册表挂载 ──
registry:
  workflow:      "registry/workflow-registry.yaml"
  element_type:  "registry/element-type-registry.yaml"   # shared 拷贝
  relations:     "registry/relations.yaml"               # shared 拷贝
  spec_template: "registry/spec-template-registry.yaml"
  input_type:    "registry/input-type-registry.yaml"
  standards:     "registry/standards-registry.yaml"

# ── 变化点（1→n，本期占位）──
change_registry:
  atomic_change:  "registry/atomic-change-registry.yaml"   # shared 拷贝
  change_mapping: "registry/change-element-mapping.yaml"   # shared 拷贝

# ── 跨 Skill 协同 ──
# FE 是链路起点，无上游依赖；下游（PRD/TDD/asset）按【阶段】声明消费 FE 产物。
upstream_dependencies: []

# ── 规范扩展（热插拔）──
standards:
  extend_index: "docs/extend-rule/INDEX.md"
  builtin_dir:  "standards/"

# ── 运行时上下文 ──
context:
  ongoing_file: "workspace/ongoing.md"
