element_type: BusinessRule
name_cn: 业务规则
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: true, relation: part_of, target: Domain, desc: 归属领域 }
  - { name: rule_type, type: enum, required: true, enum: [准入规则, 路由规则, 计算规则, 校验规则, 时限规则, 权限规则, 额度规则], desc: 规则类型 }
  - { name: description, type: string, required: true, desc: 约束描述 }
  - { name: error_code, type: string, required: false, relation: uses, target: 错误码字典, desc: 关联错误码（引用 DICT-ERROR-CODES 条目） }
  - name: exception_branches
    type: array<object>
    required: false
    sub_fields:
      - { name: condition, type: string, required: true }
      - { name: action,    type: string, required: true }
relations_held:
  - { relation: part_of, target: Domain,     via: domain,     seq: 4 }
  - { relation: uses,    target: 错误码字典,  via: error_code, seq: 37 }
stage_increments:
  FE:  [domain, rule_type, description, error_code, exception_branches]
  PRD: []
