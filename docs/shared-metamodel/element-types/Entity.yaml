element_type: Entity
name_cn: 实体
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: aggregate_member_of, type: string, required: true, relation: aggregate_member_of, target: Aggregate, desc: "归属聚合根（同事务/级联删/不可独立访问；domain 链式推）" }
  - name: fields
    type: array<object>
    required: true
    sub_fields:
      - { name: name, type: string, required: true }
      - { name: type, type: string, required: true }
      - { name: pk,   type: bool,   required: false }
      - { name: fk,   type: string, required: false }
  - { name: ddl, type: object, required: false, desc: "TDD 补：物理表 { table }" }
relations_held:
  - { relation: aggregate_member_of, target: Aggregate, via: aggregate_member_of, seq: 7 }
stage_increments:
  PRD: [aggregate_member_of, fields]
  TDD: [ddl]
