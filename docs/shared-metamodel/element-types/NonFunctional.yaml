element_type: NonFunctional
name_cn: 非功能
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: category, type: enum, required: true, enum: [performance, security, reliability, availability, usability, maintainability, scalability, compatibility, resilience, i18n, telemetry], desc: DFX 类别 }
  - { name: applies_to, type: array, required: true, relation: uses, target: SubFeature, desc: "作用于（uses 变体）；元素可为 SubFeature 或 Page" }
  - { name: fe_requirement, type: string, required: false, desc: "FE：诉求" }
  - { name: prd_design, type: string, required: false, desc: "PRD：指标" }
  - { name: tdd_implementation, type: string, required: false, desc: "TDD：方案" }
relations_held:
  - { relation: uses, target: SubFeature, via: applies_to, seq: 35 }
stage_increments:
  FE:  [category, applies_to, fe_requirement]
  PRD: [prd_design]
  TDD: [tdd_implementation]
