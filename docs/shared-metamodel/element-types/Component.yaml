element_type: Component
name_cn: 前端组件
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: component_type, type: string, required: true, desc: 业务组件/基础组件 }
  - { name: reuse_scope, type: enum, required: true, enum: [模块级, 全局级], desc: 复用范围 }
  - name: props
    type: array<object>
    required: false
    sub_fields:
      - { name: name,     type: string, required: true }
      - { name: type,     type: string, required: true }
      - { name: required, type: bool,   required: false }
  - name: emits
    type: array<object>
    required: false
    sub_fields:
      - { name: name,   type: string, required: true }
      - { name: params, type: array,  required: false }
  - name: fool_proofing
    type: array<object>
    required: false
    sub_fields:
      - { name: scene,    type: string, required: true }
      - { name: strategy, type: string, required: true }
relations_held: []
stage_increments: {}
