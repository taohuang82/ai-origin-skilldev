element_type: DomainService
name_cn: 领域服务
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: true, relation: part_of, target: Domain, desc: 归属领域 }
  - { name: collaborates_with_entities, type: array, required: true, relation: depends_on, target: Aggregate, desc: 协作聚合 }
  - name: operations
    type: array<object>
    required: true
    sub_fields:
      - { name: name, type: string, required: true }
      - { name: desc, type: string, required: false }
      - { name: enforces_rules, type: array, required: false, relation: uses, target: BusinessRule, desc: 强制的规则 }
relations_held:
  - { relation: part_of,    target: Domain,       via: domain,                       seq: 4 }
  - { relation: depends_on, target: Aggregate,    via: collaborates_with_entities,   seq: 24 }
  - { relation: uses,       target: BusinessRule, via: "operations[].enforces_rules", seq: 19 }
stage_increments: {}
