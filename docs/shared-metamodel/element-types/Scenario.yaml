element_type: Scenario
name_cn: 场景
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: scenario_type, type: enum, required: true, enum: [normal, edge, exception], desc: 场景类型 }
  - { name: from_process, type: string, required: true, relation: uses, target: BusinessProcess, desc: 派生母流程（uses 变体） }
  - name: discriminator
    type: object
    required: true
    desc: 区分维度
    sub_fields:
      - { name: dimension, type: string, required: true }
      - { name: value,     type: string, required: true }
  - { name: involves_domains, type: array, required: true, relation: part_of, target: Domain, desc: 涉及领域 }
  - { name: sub_feature_path, type: array, required: true, relation: uses, target: SubFeature, desc: 有序子特性路径 }
  - { name: call_path_mermaid, type: string, required: false, desc: 该场景子特性调用路径图 }
relations_held:
  - { relation: uses,    target: BusinessProcess, via: from_process,      seq: 16 }
  - { relation: part_of, target: Domain,          via: involves_domains,  seq: 5 }
  - { relation: uses,    target: SubFeature,      via: sub_feature_path,  seq: 17 }
stage_increments: {}
