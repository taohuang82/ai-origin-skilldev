element_type: API
name_cn: 接口
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: domain, type: string, required: true, relation: part_of, target: Domain, desc: 归属领域 }
  - { name: http_method, type: enum, required: true, enum: [GET, POST, PUT, DELETE, PATCH], desc: HTTP 方法 }
  - { name: url_path, type: string, required: true, desc: 路径 }
  - { name: realizes_sub_feature, type: string, required: true, relation: realizes, target: SubFeature, desc: 实现的子特性 }
  - { name: depends_on, type: string, required: true, relation: depends_on, target: ApplicationService, desc: 依赖的应用服务 }
  - name: request
    type: object
    required: false
    sub_fields:
      - { name: command, type: string, required: false, desc: Command/Query 子结构 }
      - name: params
        type: array<object>
        required: false
        sub_fields:
          - { name: name,       type: string, required: true }
          - { name: type,       type: string, required: true }
          - { name: required,   type: bool,   required: false }
          - { name: constraint, type: string, required: false }
  - { name: response, type: object, required: false, desc: "{ dto, fields }（DTO 子结构）" }
  - name: error_codes
    type: array<object>
    required: false
    sub_fields:
      - { name: code, type: string, required: true }
      - { name: ref,  type: string, required: true, relation: uses, target: 错误码字典, desc: 引用全局错误码字典条目 }
relations_held:
  - { relation: part_of,    target: Domain,             via: domain,                seq: 4 }
  - { relation: realizes,   target: SubFeature,         via: realizes_sub_feature,  seq: 30 }
  - { relation: depends_on, target: ApplicationService, via: depends_on,            seq: 26 }
  - { relation: uses,       target: 错误码字典,          via: "error_codes[].ref",    seq: 23 }
stage_increments: {}
