element_type: OriginalRequirement
name_cn: 原始需求
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: version, type: string, required: true, desc: "所属版本（仅本类有 version 字段）" }
  - { name: raw_description, type: string, required: true, desc: 业务方原话（不加工） }
  - name: source
    type: object
    required: true
    desc: 来源三要素
    sub_fields:
      - { name: raised_by, type: string, required: true }
      - { name: raised_at, type: string, required: true }
      - { name: channel,   type: string, required: true }
  - { name: requirement_type, type: enum, required: true, enum: [TP, AP, AI, IT], desc: 需求类型 }
  - name: triggered_changes
    type: object
    required: false
    desc: 本需求引发的变更（merge 回填）
    sub_fields:
      - { name: affected_elements, type: array, required: false, desc: 受影响要素 id（派生索引，非手工真相源） }
relations_held: []
stage_increments: {}
