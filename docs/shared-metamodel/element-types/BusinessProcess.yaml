element_type: BusinessProcess
name_cn: 业务流程
schema_version: "1.0.0"
common_fields:
  required: [id, element_type, name, status]
  optional: [domain, provenance, lineage, code_anchors, external_refs]
fields:
  - { name: involves_domains, type: array, required: true, relation: part_of, target: Domain, desc: 涉及领域（多域） }
  - name: activities
    type: array<object>
    required: true
    desc: 活动序列
    sub_fields:
      - { name: activity_id, type: string, required: true }
      - { name: name,        type: string, required: true }
      - { name: role,        type: string, required: false, relation: uses, target: Role, desc: 执行角色 }
      - { name: inputs,      type: array,  required: false, desc: 业务物（非关系） }
      - { name: outputs,     type: array,  required: false, desc: 业务物（非关系） }
      - { name: rules,       type: array,  required: false, relation: uses, target: BusinessRule, desc: 约束规则 }
      - { name: exceptions,  type: array,  required: false }
  - { name: flow_diagram_mermaid, type: string, required: true, desc: Mermaid flowchart TD }
relations_held:
  - { relation: part_of, target: Domain,       via: involves_domains,     seq: 5 }
  - { relation: uses,    target: Role,         via: "activities[].role",  seq: 8 }
  - { relation: uses,    target: BusinessRule, via: "activities[].rules", seq: 9 }
stage_increments: {}
